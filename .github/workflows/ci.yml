name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check server.js
        run: node -c server.js
      - name: Run test suite
        run: npm test

  web:
    name: Web (structural checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON-LD, inline JS, sitemap coverage, robots.txt
        run: node scripts/validate-web.js

  extension:
    name: Extension (compile + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Syntax check bundled .mjs assets
        run: node --check assets/statusline.mjs && node --check assets/poller.mjs
      - name: Package (catches missing icon/LICENSE/assets — this used to fail from a clean checkout)
        run: npx --yes @vscode/vsce package --no-dependencies -o /tmp/ci-package.vsix
