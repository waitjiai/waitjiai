<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — WaitJI AI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0A0A12;--ink2:#16161F;
  --sage:#4F46E5;--sage-d:#3730A3;--sage-l:#818CF8;--sage-soft:#EEF2FF;
  --gold:#FF6B4A;--cream:#F6F5FA;--cream2:#E9E7F2;
  --muted:#6B6B7D;--muted2:#9C9CAE;
  --border:#DEDCE8;--border2:#C7C4D6;
  --surface:#FFFFFF;--bg:#F0EFF7;
  --red:#DC2626;--red-soft:#FEE2E2;
  --green:#15803D;--green-soft:#DCFCE7;
  --display:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
@media (prefers-reduced-motion: no-preference) {
  .fade-in{animation:fadeIn .28s ease-out both;}
  .slide-up{animation:slideUp .3s cubic-bezier(.22,1,.36,1) both;}
  button, .btn, a[class*="btn"], input, select, textarea{transition:transform .15s cubic-bezier(.22,1,.36,1), box-shadow .15s ease, background-color .15s ease, border-color .15s ease;}
  button:active, .btn:active{transform:scale(.97);}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
.nav{background:rgba(243,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink);}
.nav-logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.nav-logo-mark svg{width:15px;height:15px;}
.nav-back{font-size:13px;color:var(--muted);}
.nav-back:hover{color:var(--ink);}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(11,15,10,.08);}
.login-logo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:16px;font-weight:600;margin-bottom:28px;}
.login-logo-mark{width:32px;height:32px;border-radius:8px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.login-logo-mark svg{width:18px;height:18px;}
.login-h{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13.5px;color:var(--muted);margin-bottom:24px;}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.role-tab{border:2px solid var(--border);background:transparent;border-radius:10px;padding:12px 10px;cursor:pointer;text-align:center;transition:.15s;font-family:var(--body);}
.role-tab.active{border-color:var(--sage);background:var(--sage-soft);}
.role-tab-icon{font-size:18px;margin-bottom:4px;}
.role-tab-label{font-size:13px;font-weight:600;color:var(--ink);}
.role-tab-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;font-family:var(--body);font-size:14px;color:var(--ink);outline:none;transition:.15s;}
.field input:focus{border-color:var(--sage);background:var(--surface);}
.btn-primary{width:100%;background:var(--sage);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:var(--display);cursor:pointer;margin-top:8px;transition:.15s;}
.btn-primary:hover{background:var(--sage-d);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted2);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.toggle-link{text-align:center;font-size:13px;color:var(--muted);margin-top:18px;}
.toggle-link a{color:var(--sage);font-weight:600;cursor:pointer;}
.err-box{background:var(--red-soft);border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none;}
.err-box.show{display:block;}
.ok-box{background:var(--green-soft);border:1px solid #86EFAC;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--green);margin-bottom:16px;display:none;}
.ok-box.show{display:block;}
footer{background:var(--ink);color:rgba(255,255,255,.4);padding:24px 40px;display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:12px;}
.footer-logo{font-family:var(--mono);color:rgba(255,255,255,.7);}
.footer-links{display:flex;gap:20px;}
.footer-links a{color:rgba(255,255,255,.4);}
.footer-links a:hover{color:#fff;}
@media(max-width:480px){.nav{padding:0 20px;}.login-card{padding:28px 20px;}}

.btn-oauth{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--border);border-radius:10px;padding:11px;font-size:14px;font-weight:600;font-family:var(--body);cursor:pointer;margin-bottom:10px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-oauth:hover{background:var(--cream);border-color:var(--border2);}
.oauth-logo{width:18px;height:18px;}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6L7.5 17L10.5 9L13.5 17L16.5 9L20 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19.5" cy="5" r="2" fill="#FF6B4A"/></svg></div>
    WaitJI AI
  </a>
  <a class="nav-back" href="index.html">← Back to home</a>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6L7.5 17L10.5 9L13.5 17L16.5 9L20 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19.5" cy="5" r="2" fill="#FF6B4A"/></svg></div>
      WaitJI AI
    </div>

    <h1 class="login-h" id="formTitle">Create account</h1>
    <p class="login-sub" id="formSub">Choose your role to get started</p>

    <div class="role-tabs" id="roleTabs">
      <div class="role-tab active" id="tabDev" onclick="setRole('customer')">
        <div class="role-tab-icon">💻</div>
        <div class="role-tab-label">Developer</div>
        <div class="role-tab-sub">Earn UPI income</div>
      </div>
      <div class="role-tab" id="tabAdv" onclick="setRole('advertiser')">
        <div class="role-tab-icon">📣</div>
        <div class="role-tab-label">Advertiser</div>
        <div class="role-tab-sub">Reach developers</div>
      </div>
    </div>

    
    <button class="btn-oauth" onclick="loginWithGoogle()">
      <svg class="oauth-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="btn-oauth" onclick="loginWithGitHub()">
      <svg class="oauth-logo" viewBox="0 0 24 24" fill="var(--ink)"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
      Continue with GitHub
    </button>
    <div class="divider">or sign in with email</div>
    <div class="err-box" id="errBox"></div>
    <div class="ok-box" id="okBox"></div>

    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters" autocomplete="current-password"></div>

    <button class="btn-primary" id="submitBtn" onclick="handleSubmit()">Create account</button>

    <div class="divider">or</div>
    <div class="toggle-link">
      <span id="toggleText">Already have an account?</span>
      <a onclick="toggleMode()" id="toggleLink"> Sign in</a>
    </div>
  </div>
</div>

<footer>
  <div class="footer-logo">WaitJI AI · QivaLabs LLP</div>
  <div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
</footer>

<script>
const SUPABASE_URL='https://tqfjdhneycntoasahstt.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZmpkaG5leWNudG9hc2Foc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2Mjg1ODcsImV4cCI6MjA5NzIwNDU4N30.u5oqo0c9tmZ7OxZW6R2hbMxUyVrM4nedYsGKC8PR4TA';
const API='https://waitjiai-backend.onrender.com';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let isSignIn=false, role='customer';

function setRole(r){
  role=r;
  document.getElementById('tabDev').classList.toggle('active',r==='customer');
  document.getElementById('tabAdv').classList.toggle('active',r==='advertiser');
}
// Deep-link support: advertise.html and other pages can link to login.html?role=advertiser
// to land the visitor straight on the advertiser signup tab instead of the default developer one.
(function(){
  const qp = new URLSearchParams(window.location.search);
  if (qp.get('role') === 'advertiser') setRole('advertiser');
})();
function toggleMode(){
  isSignIn=!isSignIn;
  document.getElementById('formTitle').textContent=isSignIn?'Welcome back':'Create account';
  document.getElementById('formSub').textContent=isSignIn?'Sign in to your WaitJI AI account':'Choose your role to get started';
  document.getElementById('roleTabs').style.display=isSignIn?'none':'grid';
  document.getElementById('submitBtn').textContent=isSignIn?'Sign in':'Create account';
  document.getElementById('toggleText').textContent=isSignIn?'New here?':'Already have an account?';
  document.getElementById('toggleLink').textContent=isSignIn?' Create account':' Sign in';
  clearMsg();
}
function showErr(m){const e=document.getElementById('errBox');e.textContent=m;e.classList.add('show');document.getElementById('okBox').classList.remove('show');}
function showOk(m){const e=document.getElementById('okBox');e.textContent=m;e.classList.add('show');document.getElementById('errBox').classList.remove('show');}
function clearMsg(){document.getElementById('errBox').classList.remove('show');document.getElementById('okBox').classList.remove('show');}

// ── FEATURE: landing-source attribution ──
// Reads whatever the shared capture script (in index.html/advertise.html/here)
// stored on the visitor's FIRST page load. If someone lands directly on
// login.html (e.g. a shared deep link) with nothing captured yet, capture it
// now as a fallback so attribution is never silently lost.
function captureLandingSourceOnce(){
  if(localStorage.getItem('waitji_landing_source')) return; // first-touch already recorded — never overwrite
  const params=new URLSearchParams(window.location.search);
  const data={
    referrer: document.referrer || '',
    utmSource: params.get('utm_source') || '',
    utmMedium: params.get('utm_medium') || '',
    utmCampaign: params.get('utm_campaign') || '',
    landingPage: window.location.pathname,
    firstSeenAt: Date.now(),
  };
  localStorage.setItem('waitji_landing_source', JSON.stringify(data));
}
function getStoredLandingSource(){
  captureLandingSourceOnce(); // fallback for direct-to-login visits
  try{ return JSON.parse(localStorage.getItem('waitji_landing_source')||'{}'); }catch(e){ return {}; }
}
captureLandingSourceOnce();

async function exchangeAndRedirect(access_token, userRole){
  // Exchange Supabase token for backend JWT
  const landingSource = getStoredLandingSource();
  const r=await fetch(API+'/v1/auth/exchange',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({access_token, role: userRole, landingSource})
  });
  const d=await r.json();
  if(!r.ok){showErr(d.error||'Auth exchange failed. Please try signing in again.');return;}
  localStorage.setItem('waitji_token',d.token);
  localStorage.setItem('waitji_role',d.role||d.user?.role);
  const finalRole=d.role||d.user?.role;
  if(finalRole==='admin') window.location.href='admin.html';
  else if(finalRole==='advertiser') window.location.href='advertiser.html';
  else window.location.href='customer.html';
}

async function handleSubmit(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email){showErr('Please enter your email');return;}
  if(!password||password.length<6){showErr('Password must be at least 6 characters');return;}

  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Please wait…';clearMsg();

  try{
    if(isSignIn){
      // SIGN IN via Supabase
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){showErr(error.message||'Invalid email or password');return;}
      await exchangeAndRedirect(data.session.access_token, null);
    } else {
      // SIGN UP via Supabase — store role in user_metadata
      const {data,error}=await sb.auth.signUp({
        email,password,
        options:{data:{role}}
      });
      if(error){showErr(error.message||'Could not create account');return;}
      if(data.user&&!data.session){
        // Email confirmation required
        showOk('Check your email to verify your account, then come back and sign in.');
        return;
      }
      if(data.session){
        await exchangeAndRedirect(data.session.access_token, role);
      }
    }
  }catch(e){
    showErr('Network error — backend may be starting up. Try again in a few seconds.');
  }finally{
    btn.disabled=false;btn.textContent=isSignIn?'Sign in':'Create account';
  }
}

// Check if already logged in
const existingToken=localStorage.getItem('waitji_token');
const existingRole=localStorage.getItem('waitji_role');
if(existingToken&&existingRole){
  if(existingRole==='admin') window.location.href='admin.html';
  else if(existingRole==='advertiser') window.location.href='advertiser.html';
  else window.location.href='customer.html';
}

// ── OAuth + email-confirmation redirect handling ──
// OAuth (Google/GitHub) returns with tokens in the URL hash. Supabase parses
// these asynchronously, so we listen for the auth state change rather than
// calling getSession() immediately (which races the hash parser).
let _oauthHandled = false;

// Show a loading state if we're returning from an OAuth redirect
if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
  const box = document.getElementById('submitBtn');
  if (box) { box.disabled = true; box.textContent = 'Signing you in…'; }
  showOk('Completing sign-in…');
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (_oauthHandled) return;
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.access_token) {
    _oauthHandled = true;
    await exchangeAndRedirect(session.access_token, null);
  }
});

// Fallback: if onAuthStateChange doesn't fire within 1.2s, check session directly
setTimeout(async () => {
  if (_oauthHandled) return;
  try {
    const {data:{session}} = await sb.auth.getSession();
    if (session?.access_token) {
      _oauthHandled = true;
      await exchangeAndRedirect(session.access_token, null);
    }
  } catch(e) {}
}, 1200);

// Surface OAuth errors returned in the URL
(function(){
  const p = new URLSearchParams(window.location.hash.replace('#','') || window.location.search);
  const err = p.get('error_description') || p.get('error');
  if (err) {
    showErr(decodeURIComponent(err).replace(/\+/g,' '));
    history.replaceState(null,'',window.location.pathname);
  }
})();


async function oauthLogin(provider){
  clearMsg();
  try{
    const {error}=await sb.auth.signInWithOAuth({
      provider,
      options:{
        redirectTo: window.location.origin + '/login.html',
        queryParams:{ access_type:'offline', prompt:'select_account' },
      }
    });
    if(error){
      const m=(error.message||'').toLowerCase();
      if(m.includes('provider') && (m.includes('not enabled')||m.includes('disabled'))){
        showErr(provider.charAt(0).toUpperCase()+provider.slice(1)+' sign-in is not available yet. Please sign up with your email instead.');
      } else {
        showErr(error.message||'Could not start sign-in. Try email signup instead.');
      }
    }
  }catch(e){
    showErr('Could not reach the sign-in service. Please use email signup.');
  }
}
async function loginWithGoogle(){ return oauthLogin('google'); }
async function loginWithGitHub(){ return oauthLogin('github'); }
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('password').focus();});
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')handleSubmit();});
</script>
</body>
</html>
