<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — WaitJI AI</title>
<link rel="icon" type="image/png" href="logo-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LGNX0BPWPJ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LGNX0BPWPJ');</script>
<style>
:root{
  --ink:#0B0F0A;--ink2:#1C2119;
  --sage:#2A7A4F;--sage-d:#1E5A3A;--sage-l:#3D9E68;--sage-soft:#EBF5EE;
  --gold:#F0B429;--gold-d:#C9901A;
  --cream:#F8F5EE;--cream2:#EEE9DD;
  --muted:#6B7568;--muted2:#9AA896;
  --border:#D4D9CF;--border2:#BFC5B9;
  --surface:#FFFFFF;--bg:#F3F0E8;
  --red:#DC2626;--red-soft:#FEE2E2;
  --display:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}

.nav{position:sticky;top:0;z-index:100;background:rgba(243,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.nav-logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.nav-logo-mark svg{width:15px;height:15px;}
.nav-back{font-size:13px;color:var(--muted);}
.nav-back:hover{color:var(--ink);}

.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(11,15,10,.08);}
.login-logo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:16px;font-weight:600;margin-bottom:28px;}
.login-logo-mark{width:32px;height:32px;border-radius:8px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.login-logo-mark svg{width:18px;height:18px;}
.login-h{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13.5px;color:var(--muted);margin-bottom:28px;}

.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;}
.role-tab{border:2px solid var(--border);background:transparent;border-radius:10px;padding:12px 10px;cursor:pointer;text-align:center;transition:.15s;font-family:var(--body);}
.role-tab.active{border-color:var(--sage);background:var(--sage-soft);}
.role-tab-icon{font-size:18px;margin-bottom:4px;}
.role-tab-label{font-size:13px;font-weight:600;color:var(--ink);}
.role-tab-sub{font-size:11px;color:var(--muted);margin-top:2px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;font-family:var(--body);font-size:14px;color:var(--ink);outline:none;transition:.15s;}
.field input:focus{border-color:var(--sage);background:var(--surface);}
.btn-primary{width:100%;background:var(--sage);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:var(--display);cursor:pointer;margin-top:8px;transition:.15s;}
.btn-primary:hover{background:var(--sage-d);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted2);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.toggle-link{text-align:center;font-size:13px;color:var(--muted);margin-top:20px;}
.toggle-link a{color:var(--sage);font-weight:600;cursor:pointer;}
.err-box{background:var(--red-soft);border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none;}
.err-box.show{display:block;}
.success-box{background:var(--sage-soft);border:1px solid #86EFAC;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--sage-d);margin-bottom:16px;display:none;}
.success-box.show{display:block;}

footer{background:var(--ink);color:rgba(255,255,255,.4);padding:24px 40px;display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:12px;}
.footer-logo{font-family:var(--mono);color:rgba(255,255,255,.7);}
.footer-links{display:flex;gap:20px;}
.footer-links a:hover{color:#fff;}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></div>
    WaitJI AI
  </a>
  <a class="nav-back" href="index.html">← Back to home</a>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></div>
      WaitJI AI
    </div>
    <h1 class="login-h" id="formTitle">Create account</h1>
    <p class="login-sub" id="formSub">Choose your role to get started</p>

    <div class="role-tabs" id="roleTabs">
      <div class="role-tab active" id="tabDev" onclick="setRole('customer')">
        <div class="role-tab-icon">💻</div>
        <div class="role-tab-label">Developer</div>
        <div class="role-tab-sub">Earn UPI income</div>
      </div>
      <div class="role-tab" id="tabAdv" onclick="setRole('advertiser')">
        <div class="role-tab-icon">📣</div>
        <div class="role-tab-label">Advertiser</div>
        <div class="role-tab-sub">Reach developers</div>
      </div>
    </div>

    <div class="err-box" id="errBox"></div>
    <div class="success-box" id="successBox"></div>

    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field" id="pwField"><label>Password</label><input type="password" id="password" placeholder="••••••••" autocomplete="new-password"></div>

    <button class="btn-primary" id="submitBtn" onclick="handleSubmit()">Create account</button>

    <div class="divider" id="divider">OR</div>
    <div class="toggle-link"><span id="toggleText">Already have an account?</span> <a onclick="toggleMode()"><span id="toggleLink">Sign in</span></a></div>
  </div>
</div>

<footer>
  <div class="footer-logo">WaitJI AI · QivaLabs LLP</div>
  <div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
</footer>

<script>
const API='https://waitjiai-backend.onrender.com';
let isSignIn=false, role='customer';

function setRole(r){
  role=r;
  document.getElementById('tabDev').classList.toggle('active',r==='customer');
  document.getElementById('tabAdv').classList.toggle('active',r==='advertiser');
}
function toggleMode(){
  isSignIn=!isSignIn;
  document.getElementById('formTitle').textContent=isSignIn?'Welcome back':'Create account';
  document.getElementById('formSub').textContent=isSignIn?'Sign in to your WaitJI AI account':'Choose your role to get started';
  document.getElementById('roleTabs').style.display=isSignIn?'none':'grid';
  document.getElementById('submitBtn').textContent=isSignIn?'Sign in':'Create account';
  document.getElementById('toggleText').textContent=isSignIn?'New here?':'Already have an account?';
  document.getElementById('toggleLink').textContent=isSignIn?'Create account':'Sign in';
  clearMsg();
}
function showErr(m){const e=document.getElementById('errBox');e.textContent=m;e.classList.add('show');document.getElementById('successBox').classList.remove('show');}
function showOk(m){const e=document.getElementById('successBox');e.textContent=m;e.classList.add('show');document.getElementById('errBox').classList.remove('show');}
function clearMsg(){document.getElementById('errBox').classList.remove('show');document.getElementById('successBox').classList.remove('show');}

async function handleSubmit(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showErr('Email and password are required');return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Please wait…';
  try{
    const endpoint=isSignIn?'/v1/auth/login':'/v1/auth/signup';
    const body=isSignIn?{email,password}:{email,password,role};
    const r=await fetch(API+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){showErr(d.error||'Something went wrong. Please try again.');return;}
    if(!isSignIn&&d.message&&d.message.includes('confirm')){showOk('Check your email to confirm your account, then sign in.');return;}
    // Exchange Supabase token for backend JWT
    const ex=await fetch(API+'/v1/auth/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:d.access_token})});
    const exd=await ex.json();
    if(!ex.ok){showErr('Auth error — please try again.');return;}
    localStorage.setItem('waitji_token',exd.token);
    localStorage.setItem('waitji_role',exd.role);
    if(exd.role==='admin')window.location.href='admin.html';
    else if(exd.role==='advertiser')window.location.href='advertiser.html';
    else window.location.href='customer.html';
  }catch(e){showErr('Network error — backend may be starting up. Try again in a few seconds.');}
  finally{btn.disabled=false;btn.textContent=isSignIn?'Sign in':'Create account';}
}
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('password').focus();});
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')handleSubmit();});
</script>
</body>
</html>
