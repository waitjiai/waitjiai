<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WaitJI AI — Advertiser Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{
  --ink:#0B0F0A;--sage:#2A7A4F;--sage-d:#1E5A3A;--sage-l:#3D9E68;--sage-soft:#EBF5EE;
  --gold:#F0B429;--gold-soft:#FEF9EC;--gold-d:#C9901A;
  --red:#DC2626;--red-soft:#FEE2E2;--blue:#3B82F6;--blue-soft:#EFF6FF;
  --cream:#F8F5EE;--cream2:#EEE9DD;--muted:#6B7568;--muted2:#9AA896;
  --border:#D4D9CF;--surface:#fff;--bg:#F3F0E8;
  --display:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;}
.topbar{background:rgba(248,245,238,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:15px;font-weight:600;}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:14px;height:14px;}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 0;}
.sb-item{padding:9px 20px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:9px;transition:.12s;border-left:2.5px solid transparent;}
.sb-item:hover{color:var(--ink);background:var(--cream);}
.sb-item.active{color:var(--sage-d);background:var(--sage-soft);border-left-color:var(--sage);font-weight:600;}
.sb-section{padding:14px 20px 6px;font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;}
.main{padding:28px 32px;}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.metric.hero{background:var(--ink);color:#fff;}
.metric.hero .ml{color:rgba(255,255,255,.55);}
.metric.hero .ms{color:rgba(255,255,255,.4);}
.ml{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.mv{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;}
.ms{font-size:11.5px;color:var(--muted2);margin-top:5px;}

/* PANELS */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;}
.ph{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pt{font-family:var(--display);font-size:14px;font-weight:700;}
.pb{padding:18px;}

/* FORM */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:var(--body);outline:none;color:var(--ink);transition:.15s;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--sage);background:var(--surface);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-hint{font-size:11.5px;color:var(--muted2);margin-top:5px;}

/* GEO TAG */
.geo-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.geo-tag{display:inline-flex;align-items:center;gap:5px;background:var(--sage-soft);color:var(--sage-d);border:1px solid #A7F3C8;border-radius:100px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.geo-tag.selected{background:var(--sage);color:#fff;border-color:var(--sage);}
.geo-tag.exclude{background:var(--red-soft);color:var(--red);border-color:#FECACA;}

/* TARGETING OPTIONS */
.target-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.target-opt{border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:center;transition:.12s;background:var(--surface);}
.target-opt:hover{border-color:var(--sage);background:var(--sage-soft);}
.target-opt.sel{border-color:var(--sage);background:var(--sage-soft);font-weight:600;}
.target-opt-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.target-opt-sub{font-size:11px;color:var(--muted);}

/* CAMPAIGN CARD */
.camp-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;}
.camp-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px;}
.camp-name{font-size:15px;font-weight:700;}
.camp-ad{font-size:13px;color:var(--muted);margin-top:2px;}
.camp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px;}
.camp-stat{text-align:center;background:var(--cream);border-radius:7px;padding:8px;}
.cs-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.cs-val{font-family:var(--mono);font-size:14px;font-weight:600;}
.camp-geo{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.camp-geo-tag{font-size:11px;background:var(--blue-soft);color:var(--blue);padding:2px 9px;border-radius:100px;font-family:var(--mono);}
.camp-actions{display:flex;gap:8px;}
.progress-bar{height:5px;background:var(--cream2);border-radius:100px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:100px;background:var(--sage);transition:.3s;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;}
.bg-green{background:var(--sage-soft);color:var(--sage-d);}
.bg-gold{background:var(--gold-soft);color:var(--gold-d);}
.bg-red{background:var(--red-soft);color:var(--red);}
.bg-gray{background:var(--cream2);color:var(--muted);}
.bg-blue{background:var(--blue-soft);color:var(--blue);}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--body);transition:.12s;}
.btn-p{background:var(--sage);color:#fff;}
.btn-p:hover{background:var(--sage-d);}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-o:hover{background:var(--cream);}
.btn-d{background:var(--red-soft);color:var(--red);border:1px solid #FECACA;}
.btn-full{width:100%;padding:13px;font-size:15px;}

/* CHART */
.chart-wrap{position:relative;height:200px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;}
.mh{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
.mh h2{font-family:var(--display);font-size:18px;font-weight:700;}
.mb{padding:20px 24px;}
.mf{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-btn{background:var(--cream2);border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--muted);}

/* STEP TABS */
.steps{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);}
.step-tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:default;}
.step-tab.done{color:var(--sage);}
.step-tab.active{color:var(--ink);border-bottom-color:var(--sage);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
<script>function logout(){localStorage.clear();window.location.href='login.html';}</script>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.4)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></div>
    WaitJI AI
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;font-family:var(--mono);background:var(--blue-soft);color:var(--blue);">ADVERTISER</span>
    <span style="font-size:13px;color:var(--muted);" id="userEmail">—</span>
    <button class="btn btn-o" style="padding:5px 12px;" onclick="logout()">Sign out</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-section">Overview</div>
    <div class="sb-item active" id="nav-overview" onclick="goTo('overview')">📊 Overview</div>
    <div class="sb-item" id="nav-campaigns" onclick="goTo('campaigns')">📣 Campaigns</div>
    <div class="sb-item" id="nav-analytics" onclick="goTo('analytics')">📈 Analytics</div>
    <div class="sb-section">Campaign</div>
    <div class="sb-item" id="nav-create" onclick="goTo('create')">+ New campaign</div>
    <div class="sb-section">Account</div>
    <div class="sb-item" id="nav-profile" onclick="goTo('profile')">🏢 Company profile</div>
    <div class="sb-item" id="nav-billing" onclick="goTo('billing')">💳 Billing</div>
  </aside>

  <main class="main" id="mainContent">
    <div style="text-align:center;padding:60px;color:var(--muted);font-family:var(--mono)">Loading…</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://waitjiai-backend.onrender.com';
const token=localStorage.getItem('waitji_token');
if(!token||localStorage.getItem('waitji_role')!=='advertiser'){window.location.href='login.html';}
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let me=null, camps=[], analytics={};
let curTab='overview';

// Country-specific pricing (mirrors backend GEO_PRICING)
const GEO_PRICING = {
  IN:  { currency:'INR', symbol:'₹',    rate:1,    spotlight:{min:800, rec:800},   stream:{min:300, rec:300},   minBudgetS:5000,  minBudgetSt:2000,  flag:'🇮🇳', label:'India' },
  US:  { currency:'USD', symbol:'$',    rate:83.9, spotlight:{min:12,  rec:14},    stream:{min:5,   rec:6},     minBudgetS:120,   minBudgetSt:50,    flag:'🇺🇸', label:'USA' },
  GB:  { currency:'GBP', symbol:'£',    rate:106,  spotlight:{min:10,  rec:12},    stream:{min:4.5, rec:5},     minBudgetS:95,    minBudgetSt:40,    flag:'🇬🇧', label:'UK' },
  SG:  { currency:'SGD', symbol:'S$',   rate:62,   spotlight:{min:16,  rec:18},    stream:{min:6.5, rec:7.5},   minBudgetS:150,   minBudgetSt:60,    flag:'🇸🇬', label:'Singapore' },
  AU:  { currency:'AUD', symbol:'A$',   rate:54.5, spotlight:{min:18,  rec:21},    stream:{min:7.5, rec:8.5},   minBudgetS:160,   minBudgetSt:65,    flag:'🇦🇺', label:'Australia' },
  CA:  { currency:'CAD', symbol:'C$',   rate:61.5, spotlight:{min:16,  rec:19},    stream:{min:6.5, rec:7.5},   minBudgetS:150,   minBudgetSt:60,    flag:'🇨🇦', label:'Canada' },
  DE:  { currency:'EUR', symbol:'€',    rate:90.5, spotlight:{min:11,  rec:13},    stream:{min:4.5, rec:5.5},   minBudgetS:100,   minBudgetSt:40,    flag:'🇩🇪', label:'Germany' },
  NL:  { currency:'EUR', symbol:'€',    rate:90.5, spotlight:{min:11,  rec:13},    stream:{min:4.5, rec:5.5},   minBudgetS:100,   minBudgetSt:40,    flag:'🇳🇱', label:'Netherlands' },
  AE:  { currency:'AED', symbol:'AED ', rate:22.85,spotlight:{min:40,  rec:48},    stream:{min:16,  rec:20},    minBudgetS:370,   minBudgetSt:150,   flag:'🇦🇪', label:'UAE' },
  JP:  { currency:'JPY', symbol:'¥',    rate:0.56, spotlight:{min:1800,rec:2200},  stream:{min:750, rec:900},   minBudgetS:16500, minBudgetSt:6600,  flag:'🇯🇵', label:'Japan' },
};

let curPricing = GEO_PRICING['IN'];
let curCountry = 'IN';

function updatePricingForGeo(){
  // Get primary country from selected geo
  const primary = geoForm.countries[0] || 'IN';
  if(curCountry === primary) return;
  curCountry = primary;
  curPricing = GEO_PRICING[primary] || GEO_PRICING['IN'];

  // Update bid input min/value
  const bidEl = document.getElementById('bid');
  const budgetEl = document.getElementById('budget');
  const bidLabelEl = document.getElementById('bidLabel');
  const budgetLabelEl = document.getElementById('budgetLabel');

  if(bidEl){
    const minBid = adType==='spotlight' ? curPricing.spotlight.min : curPricing.stream.min;
    bidEl.min = minBid;
    bidEl.value = minBid;
    bidEl.placeholder = curPricing.symbol + minBid + '/1K';
  }
  if(budgetEl){
    const minBudget = adType==='spotlight' ? curPricing.minBudgetS : curPricing.minBudgetSt;
    budgetEl.min = minBudget;
    budgetEl.value = minBudget * 2;
    budgetEl.placeholder = curPricing.symbol + minBudget;
  }
  if(bidLabelEl) bidLabelEl.textContent = `Bid per 1,000 impressions (${curPricing.currency}) — min ${curPricing.symbol}${adType==='spotlight'?curPricing.spotlight.min:curPricing.stream.min}`;
  if(budgetLabelEl) budgetLabelEl.textContent = `Total budget (${curPricing.currency}) — min ${curPricing.symbol}${adType==='spotlight'?curPricing.minBudgetS:curPricing.minBudgetSt}`;

  updateBudgetCalc();
  updateCurrencyBadge();
  toast(`💱 Pricing updated for ${curPricing.label} (${curPricing.currency})`);
}

function updateCurrencyBadge(){
  const el = document.getElementById('currencyBadge');
  if(el) el.textContent = `${curPricing.flag||''} ${curPricing.currency} pricing`;
}

function localToINRPaise(localAmt){
  // Convert local currency amount to INR paise
  return Math.round(localAmt * curPricing.rate * 100);
}

function logout(){localStorage.clear();window.location.href='login.html';}
function toast(msg,d=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),d);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n||0).toLocaleString('en-IN');}
function fmtRs(p){return '₹'+((p||0)/100).toFixed(2);}
function statusBadge(s){
  const map={active:'bg-green',paused:'bg-gray',pending_review:'bg-gold',pending_payment:'bg-red',rejected:'bg-red',completed:'bg-blue'};
  const label={active:'Active',paused:'Paused',pending_review:'Under review',pending_payment:'Awaiting payment',rejected:'Rejected',completed:'Completed'};
  return `<span class="badge ${map[s]||'bg-gray'}">${label[s]||s}</span>`;
}

const INDIA_STATES=[
  {code:'MH',name:'Maharashtra'},  {code:'KA',name:'Karnataka'},
  {code:'DL',name:'Delhi'},         {code:'TN',name:'Tamil Nadu'},
  {code:'TS',name:'Telangana'},     {code:'UP',name:'Uttar Pradesh'},
  {code:'GJ',name:'Gujarat'},       {code:'RJ',name:'Rajasthan'},
  {code:'WB',name:'West Bengal'},   {code:'AP',name:'Andhra Pradesh'},
  {code:'KL',name:'Kerala'},        {code:'MP',name:'Madhya Pradesh'},
  {code:'PB',name:'Punjab'},        {code:'HR',name:'Haryana'},
  {code:'BR',name:'Bihar'},
];
const TIER1_CITIES=['Bengaluru','Mumbai','Delhi','Hyderabad','Pune','Chennai','Kolkata','Ahmedabad','Jaipur','Surat','Lucknow','Chandigarh','Udaipur','Noida','Gurgaon'];
const COUNTRIES=[{code:'IN',name:'India 🇮🇳',currency:'₹'},{code:'US',name:'USA 🇺🇸',currency:'$'},{code:'GB',name:'UK 🇬🇧',currency:'£'},{code:'SG',name:'Singapore 🇸🇬',currency:'S$'},{code:'AU',name:'Australia 🇦🇺',currency:'A$'},{code:'CA',name:'Canada 🇨🇦',currency:'C$'},{code:'DE',name:'Germany 🇩🇪',currency:'€'},{code:'NL',name:'Netherlands 🇳🇱',currency:'€'},{code:'AE',name:'UAE 🇦🇪',currency:'AED'},{code:'JP',name:'Japan 🇯🇵',currency:'¥'}];

// Campaign form state
let geoForm={countries:['IN'],states:[],cities:[],excludeCountries:[]};
let targetForm={devExperience:'all',ideTools:['vscode'],timeOfDay:'all',languages:[]};
let adType='spotlight';

async function load(){
  try{
    const _ac=new AbortController(); const _to=setTimeout(()=>_ac.abort(),10000);
    const [meR,cR,aR]=await Promise.all([
      fetch(API+'/v1/auth/me',{headers:H,signal:_ac.signal}),
      fetch(API+'/v1/advertiser/campaigns',{headers:H,signal:_ac.signal}),
      fetch(API+'/v1/advertiser/analytics',{headers:H,signal:_ac.signal}),
    ]);
    clearTimeout(_to);
    if(!meR.ok){logout();return;}
    me=(await meR.json()).user;
    camps=(await cR.json()).campaigns||[];
    analytics=(await aR.json())||{};
    document.getElementById('userEmail').textContent=me.email;
    goTo(curTab);
  }catch(e){document.getElementById('mainContent').innerHTML='<div style="text-align:center;padding:60px;color:var(--red)">Error — <a href="" onclick="location.reload()">retry</a></div>';}
}

function goTo(tab){
  curTab=tab;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+tab);
  if(nav) nav.classList.add('active');
  if(tab==='overview') renderOverview();
  else if(tab==='campaigns') renderCampaigns();
  else if(tab==='analytics') renderAnalytics();
  else if(tab==='create') renderCreate();
  else if(tab==='profile') renderProfile();
  else if(tab==='billing') renderBilling();
}

// ── OVERVIEW ──
function renderOverview(){
  const a=analytics;
  const totalSpent=camps.reduce((s,c)=>s+(c.spentPaise||0),0);
  const totalBudget=camps.reduce((s,c)=>s+(c.budgetPaise||0),0);
  const totalImps=a.totalImpressions||0;
  const totalClicks=a.totalClicks||0;
  const ctr=totalImps?((totalClicks/totalImps)*100).toFixed(2):'0.00';
  const activeCamps=camps.filter(c=>c.status==='active').length;
  const pendingReview=camps.filter(c=>c.status==='pending_review').length;

  document.getElementById('mainContent').innerHTML=`
  <h1 style="font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:4px;">Advertiser Dashboard</h1>
  <p style="font-size:13.5px;color:var(--muted);margin-bottom:22px;">Welcome back${me.company?' — '+esc(me.company):''}. Your campaigns are reaching Indian developers.</p>

  ${pendingReview?`<div style="background:var(--gold-soft);border:1px solid #FDE68A;border-radius:10px;padding:11px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#92400E;">
    <span>⏳ <b>${pendingReview}</b> campaign(s) under review (within 24h)</span>
    <button class="btn btn-o" style="padding:5px 12px;font-size:12px;" onclick="goTo('campaigns')">View →</button>
  </div>`:''}

  <div class="metric-grid">
    <div class="metric hero"><div class="ml">Total spent</div><div class="mv">${fmtRs(totalSpent)}</div><div class="ms">of ${fmtRs(totalBudget)} budget</div></div>
    <div class="metric"><div class="ml">Impressions</div><div class="mv">${fmt(totalImps)}</div><div class="ms">unique devs: ${fmt(a.uniqueUsersReached||0)}</div></div>
    <div class="metric"><div class="ml">CTR</div><div class="mv">${ctr}%</div><div class="ms">${totalClicks} valid clicks</div></div>
    <div class="metric"><div class="ml">Active campaigns</div><div class="mv">${activeCamps}</div><div class="ms">of ${camps.length} total</div></div>
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;">
    <div>
      <div class="panel">
        <div class="ph"><div class="pt">Daily spend — 14 days</div></div>
        <div class="pb"><div class="chart-wrap"><canvas id="spendChart"></canvas></div></div>
      </div>
      <div class="panel">
        <div class="ph"><div class="pt">Active campaigns</div><button class="btn btn-p" style="padding:6px 14px;" onclick="goTo('create')">+ New</button></div>
        <div style="padding:0 18px;">
          ${camps.filter(c=>c.status==='active').slice(0,3).map(c=>`
          <div style="padding:12px 0;border-bottom:1px solid var(--border);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">

function selectAdType(type){
  adType=type;
  document.querySelectorAll('.target-opt').forEach((el,i)=>{if(i<2){el.classList.toggle('sel',i===(type==='spotlight'?0:1));}});
  const bidEl=document.getElementById('bid');
  if(bidEl){bidEl.min=type==='spotlight'?800:300;bidEl.value=type==='spotlight'?800:300;}
  updateBudgetCalc();
}
function toggleGeo(type,val){
  if(type==='country'){
    const idx=geoForm.countries.indexOf(val);
    if(idx>=0) geoForm.countries.splice(idx,1); else geoForm.countries.push(val);
    document.querySelectorAll('#countryTags .geo-tag').forEach((el,i)=>el.classList.toggle('selected',geoForm.countries.includes(COUNTRIES[i].code)));
  } else if(type==='state'){
    const idx=geoForm.states.indexOf(val);
    if(idx>=0) geoForm.states.splice(idx,1); else geoForm.states.push(val);
    document.querySelectorAll('#stateTags .geo-tag').forEach((el,i)=>el.classList.toggle('selected',geoForm.states.includes(INDIA_STATES[i].code)));
  } else if(type==='city'){
    const idx=geoForm.cities.indexOf(val);
    if(idx>=0) geoForm.cities.splice(idx,1); else geoForm.cities.push(val);
    document.querySelectorAll('#cityTags .geo-tag').forEach((el,i)=>el.classList.toggle('selected',geoForm.cities.includes(TIER1_CITIES[i])));
  }
  updateGeoSummary();
  updatePricingForGeo();
}
function setTarget(key,val,el){
  targetForm[key]=val;
  if(el){
    const parent=el.closest('[data-target-group]')||el.parentElement;
    parent?.querySelectorAll('.target-opt').forEach(e=>e.classList.remove('sel'));
    el.classList.add('sel');
  }
}
function toggleTarget(key,val){
  const arr=targetForm[key];
  const idx=arr.indexOf(val);
  if(idx>=0) arr.splice(idx,1); else arr.push(val);
}
function updatePreview(){
  const text=document.getElementById('adText')?.value||'Your ad here';
  const el1=document.getElementById('prevText');
  const el2=document.getElementById('prevStatus');
  const cnt=document.getElementById('charCount');
  if(el1) el1.textContent='WaitJI: '+text.slice(0,40);
  if(el2) el2.textContent='WaitJI AI · '+text;
  if(cnt) cnt.textContent=text.length+'/60';
}
function updateGeoSummary(){
  const el=document.getElementById('geoSummary');
  const reach=document.getElementById('reachEst');
  if(!el) return;
  const parts=[];
  if(geoForm.countries.length) parts.push(geoForm.countries.map(c=>COUNTRIES.find(x=>x.code===c)?.name||c).join(', '));
  if(geoForm.states.length) parts.push(INDIA_STATES.filter(s=>geoForm.states.includes(s.code)).map(s=>s.name).join(', '));
  if(geoForm.cities.length) parts.push(geoForm.cities.join(', '));
  el.textContent=parts.length?parts.join(' → '):'🌐 All of India (no geo filter)';
  if(reach){
    const stateMulti=geoForm.states.length?Math.max(0.1,geoForm.states.length/15):1;
    const cityMulti=geoForm.cities.length?Math.max(0.05,geoForm.cities.length/20):1;
    const base=5000;
    const est=Math.round(base*stateMulti*cityMulti);
    reach.textContent=Math.round(est*0.4).toLocaleString('en-IN')+'–'+est.toLocaleString('en-IN');
  }
}
function updateBudgetCalc(){
  const el=document.getElementById('budgetCalc');
  if(!el) return;
  const sym = curPricing?.symbol || '₹';
  const budget=parseFloat(document.getElementById('budget')?.value||0);
  const bid=parseFloat(document.getElementById('bid')?.value||0);
  const budgetINRPaise = localToINRPaise ? localToINRPaise(budget) : budget*100;
  const bidINRPaise = localToINRPaise ? localToINRPaise(bid) : bid*100;
  const estImps=bidINRPaise>0?Math.floor(budgetINRPaise/bidINRPaise*1000):0;
  const estClicks=Math.floor(estImps*0.005);
  const devShareLocal=Math.floor(budget*0.65);
  const inrEquiv = curPricing?.rate!==1 ? `<div style="font-size:11px;color:var(--muted2);margin-top:4px;">≈ ₹${Math.round(budget*curPricing.rate).toLocaleString('en-IN')} INR</div>` : '';
  el.innerHTML=`<div style="background:var(--cream2);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--sage-d);">

    <span style="font-weight:400;color:var(--muted);">· All charges in INR at ~${curPricing?.rate||1} ${curPricing?.currency||'INR'}/₹1 exchange rate</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    <div><div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Est. impressions</div><div style="font-family:var(--mono);font-size:16px;font-weight:700;">${fmt(estImps)}</div></div>
    <div><div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Est. clicks</div><div style="font-family:var(--mono);font-size:16px;font-weight:700;">${fmt(estClicks)}</div></div>
    <div><div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Dev pool (65%)</div><div style="font-family:var(--mono);font-size:16px;font-weight:700;color:var(--sage);">${sym}${devShareLocal.toFixed(0)}</div></div>
    <div><div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">In INR</div><div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--muted);">₹${Math.round(budget*(curPricing?.rate||1)).toLocaleString('en-IN')}</div></div>
  </div>`;
  // Reach estimator — debounced API call
  clearTimeout(window._reachTimer);
  window._reachTimer = setTimeout(async ()=>{
    try{
      const r=await fetch(API+'/v1/advertiser/reach-estimate',{method:'POST',headers:H,body:JSON.stringify({geo:{countries:['IN']},adType})});
      const d=await r.json();
      const re=document.getElementById('reachEstimate');
      const rd=document.getElementById('reachData');
      if(re&&rd&&d.estimatedDailyReach){
        rd.innerHTML=`~<b>${d.estimatedDailyReach}</b> active developers reachable · ~<b>${d.estimatedDailyImpressions}</b> impressions/day at current competition`;
        re.style.display='block';
      }
    }catch(e){}
  },800);
}

let appliedDiscount=null;
async function validateDiscount(){
  const code=document.getElementById('discountCode').value.trim().toUpperCase();
  if(!code){toast('⚠️ Enter a discount code');return;}
  const r=await fetch(API+'/v1/discount/validate',{method:'POST',headers:H,body:JSON.stringify({code})});
  const d=await r.json();
  const el=document.getElementById('discountResult');
  if(r.ok&&d.valid){
    appliedDiscount=d;
    el.innerHTML=`<span style="color:#047857">✓ ${d.discountPct}% off applied — ${esc(d.description||'')}</span>`;
  } else {
    appliedDiscount=null;
    el.innerHTML=`<span style="color:var(--red)">✗ ${d.error||'Invalid code'}</span>`;
  }
}

async function createCampaign(){
  const adText=document.getElementById('adText')?.value.trim();
  const url=document.getElementById('adUrl')?.value.trim();
  const budget=parseFloat(document.getElementById('budget')?.value||0);
  const bid=parseFloat(document.getElementById('bid')?.value||0);
  const campName=document.getElementById('campName')?.value.trim();
  const companyName=document.getElementById('companyName')?.value.trim();
  const ctaText=document.getElementById('ctaText')?.value.trim();
  if(!adText){toast('⚠️ Enter ad text');return;}
  if(!url||!url.startsWith('http')){toast('⚠️ Enter a valid URL');return;}
  if(budget<(adType==='spotlight'?5000:2000)){toast(`⚠️ Minimum budget is ₹${adType==='spotlight'?5000:2000}`);return;}
  if(bid<(adType==='spotlight'?800:300)){toast(`⚠️ Minimum bid is ₹${adType==='spotlight'?800:300}/1K`);return;}
  toast('Creating campaign…');
  const r=await fetch(API+'/v1/advertiser/campaigns',{method:'POST',headers:H,body:JSON.stringify({
    adText, url, adType,
    campaignName: campName||adText.slice(0,40),
    companyName,
    ctaText,
    bidPaise: localToINRPaise(bid),
    budgetPaise: localToINRPaise(budget),
    geo: geoForm,
    targeting: targetForm,
  })});
  const d=await r.json();
  if(!r.ok){toast('⚠️ '+(d.error||'Failed'));return;}
  await payForCampaign(d.campaign.id, d.campaign.budgetPaise);
}

async function payForCampaign(campaignId, amountPaise){
  const discountCode=appliedDiscount?.code||document.getElementById('discountCode')?.value.trim().toUpperCase()||'';
  toast('💳 Opening payment…');
  const r=await fetch(API+'/v1/advertiser/campaigns/'+campaignId+'/create-order',{method:'POST',headers:H,body:JSON.stringify({discountCode:discountCode||undefined})});
  const d=await r.json();
  if(!r.ok){toast('⚠️ '+(d.error||'Payment failed'));return;}
  const rzp=new Razorpay({
    key:d.keyId, amount:d.amountPaise, currency:'INR',
    name:'WaitJI AI', description:'Developer ad campaign',
    order_id:d.orderId,
    prefill:{email:me.email,name:me.name||''},
    theme:{color:'#2A7A4F'},
    handler:async function(resp){
      toast('Verifying…');
      const vr=await fetch(API+'/v1/advertiser/campaigns/'+campaignId+'/verify-payment',{method:'POST',headers:H,body:JSON.stringify({razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature})});
      if(vr.ok){toast('✅ Payment done — campaign under review (24h)');await load();goTo('campaigns');}
      else toast('⚠️ Payment verification failed — contact support');
    },
    modal:{ondismiss:()=>{toast('Payment cancelled');}}
  });
  rzp.open();
}

async function downloadInvoice(id){
  const r=await fetch(API+'/v1/advertiser/campaigns/'+id+'/invoice',{headers:H});
  const d=await r.json();
  if(!r.ok){toast('⚠️ '+(d.error||'Invoice not available'));return;}
  const inv=d.invoice;
  const css='body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;color:#111;font-size:14px;}h1{font-size:24px;margin-bottom:4px;}table{width:100%;border-collapse:collapse;margin:16px 0;}th,td{text-align:left;padding:8px 12px;border:1px solid #ddd;}th{background:#f5f5f5;}.total{font-weight:700;font-size:16px;}.footer{margin-top:32px;font-size:12px;color:#666;}';
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Invoice '+inv.invoiceNo+'<'+'/title><style>'+css+'<'+'/'+'style><'+'/'+'head><body>'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:24px;"><div><h1>Tax Invoice</h1><div style="color:#666;">Invoice No: <b>'+inv.invoiceNo+'</b></div><div style="color:#666;">Date: '+inv.date+'</div></div><div style="text-align:right;"><div><b>'+inv.seller.name+'</b></div><div>'+inv.seller.address+'</div></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;"><div><div style="font-weight:700;margin-bottom:6px;">Billed to</div><div>'+inv.buyer.name+'</div><div>'+inv.buyer.email+'</div><div>GSTIN: '+(inv.buyer.gstin||'N/A')+'</div></div></div>'
    +'<table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td>'+(inv.items?.[0]?.desc||'Ad campaign')+'</td><td>₹'+inv.subtotal?.toFixed(2)+'</td></tr></tbody></table>'
    +'<div style="text-align:right;"><div>Subtotal: ₹'+inv.subtotal?.toFixed(2)+'</div><div>CGST 9%: ₹'+inv.cgst?.toFixed(2)+'</div><div>SGST 9%: ₹'+inv.sgst?.toFixed(2)+'</div><div class="total">Total: ₹'+inv.total?.toFixed(2)+'</div></div>'
    +'<div class="footer"><p>QivaLabs LLP · Udaipur, Rajasthan · LLPIN ACV-6746 · DPIIT DIPP247112</p><p>This is a computer-generated invoice.</p></div><'+'/'+'body><'+'/'+'html>';
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invoice-'+inv.invoiceNo+'.html';a.click();
  toast('✓ Invoice downloaded');
}

    const ctx=document.getElementById('impChart');

    const geoEl=document.getElementById('geoBreakdown');
    if(geoEl) geoEl.innerHTML='<div style="font-size:12px;color:var(--muted2);">Could not load geo data</div>';
  });
}
