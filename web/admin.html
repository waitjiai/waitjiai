<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitJI AI — Admin Panel</title>

<style>
:root{
  --ink:#0A0A12;--ink2:#16161F;
  --sage:#4F46E5;--sage-d:#3730A3;--sage-l:#818CF8;--sage-soft:#EEF2FF;
  --gold:#FF6B4A;--gold-d:#E1502F;--gold-l:#FFA588;--gold-soft:#FFF1EC;
  --cream:#F6F5FA;--cream2:#E9E7F2;
  --muted:#6B6B7D;--muted2:#9C9CAE;
  --border:#DEDCE8;--border2:#C7C4D6;
  --surface:#FFFFFF;--surface2:#F6F5FA;--bg:#F0EFF7;
  --red:#DC2626;--red-soft:#FEE2E2;
  --green:#15803D;--green-soft:#DCFCE7;
  --amber:#D97706;--amber-soft:#FEF3C7;
  /* backward compat aliases */
  --indigo:var(--sage);--indigo-dark:var(--sage-d);--indigo-soft:var(--sage-soft);
  --sky:var(--sage-l);
  --display:'Sora',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Sora',sans-serif;
  --shadow-sm:0 1px 3px rgba(11,15,10,.06);
  --shadow:0 4px 24px rgba(11,15,10,.10);
}
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--ink);border-bottom:1px solid #1A1F3D;}
.logo{font-family:var(--mono);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;}
.logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--sage),var(--sky));display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:17px;height:17px;}.logo em{color:#818CF8;font-style:normal;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,18,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:#fff;border-radius:14px;padding:22px 24px;max-height:80vh;overflow-y:auto;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.topbar-r{display:flex;align-items:center;gap:14px;}
.role-pill{font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;background:rgba(129,140,248,.2);color:#A5B4FC;font-family:var(--mono);}
.user-email{font-size:13px;color:#9AA0B4;}
.btn-out{background:transparent;border:1px solid #2A2F4D;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);}
.btn-out:hover{border-color:#818CF8;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:28px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
.modal h2{font-family:var(--sans);font-size:19px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.modal-actions{display:flex;gap:10px;}
.modal table th,.modal table td{padding:7px 8px;border-bottom:1px solid var(--border2);}
.wrap{max-width:1180px;margin:0 auto;padding:32px;}
.page-h{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.tabs{display:flex;gap:6px;margin-bottom:26px;background:var(--surface);padding:6px;border-radius:13px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;}
.admin-shell{display:flex;gap:24px;align-items:flex-start;}
.admin-sidebar{width:210px;flex-shrink:0;position:sticky;top:80px;display:flex;flex-direction:column;gap:18px;}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-group-label{font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;padding:0 10px;margin-bottom:4px;}
.admin-sidebar .tab{text-align:left;justify-content:flex-start;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;}
.admin-sidebar .tab:hover{background:var(--cream2);}
.admin-sidebar .tab.active{background:var(--sage);color:#fff;}
.admin-main{flex:1;min-width:0;}
@media(max-width:900px){
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%;position:static;flex-direction:row;flex-wrap:wrap;gap:10px;}
  .nav-group{flex-direction:row;flex-wrap:wrap;}
  .nav-group-label{display:none;}
}
.tab.active{background:var(--indigo);color:#fff;}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
.card.danger{background:var(--red-soft);border-color:#FCA5A5;}
.card.safe{background:var(--green-soft);border-color:#A7F3D0;}
.card-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px;}
.danger .card-label{color:#B91C1C;}.safe .card-label{color:#047857;}
.card-val{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-1px;}
.danger .card-val{color:#B91C1C;}.safe .card-val{color:#047857;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:3px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
.panel-h{font-family:var(--sans);font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);font-size:12px;}
.status{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;}
.status.active{background:var(--green-soft);color:#047857;}
.status.pending{background:var(--amber-soft);color:#92400E;}
.status.paused{background:var(--surface2);color:var(--muted);}
.status.rejected{background:var(--red-soft);color:#B91C1C;}
.status.completed{background:var(--indigo-soft);color:var(--indigo);}
.sev{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;}
.sev.critical{background:var(--red);color:#fff;}
.sev.high{background:var(--red-soft);color:#B91C1C;}
.sev.medium{background:var(--amber-soft);color:#92400E;}
.mini-btn{background:var(--surface2);border:1px solid var(--border2);padding:5px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-family:var(--body);font-weight:600;color:var(--ink2);margin-right:5px;}
.mini-btn:hover{border-color:var(--indigo);color:var(--indigo);}
.mini-btn.green{color:#047857;border-color:#A7F3D0;}.mini-btn.green:hover{background:var(--green-soft);}
.mini-btn.red{color:#B91C1C;border-color:#FCA5A5;}.mini-btn.red:hover{background:var(--red-soft);}
.empty{text-align:center;padding:46px;color:var(--muted2);}
.empty-ic{font-size:34px;margin-bottom:10px;}
.fraud-types{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.ftype{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;}
.ftype b{font-family:var(--mono);color:var(--red);font-size:15px;display:block;}
.thresholds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px;}
.thresh{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.thresh-k{font-size:11px;color:var(--muted);}
.thresh-v{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--indigo);}
.loading{text-align:center;padding:60px;color:var(--muted2);font-family:var(--mono);}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);}
.modal-err{display:none;background:#FEE2E2;color:#B91C1C;border:1px solid #FCA5A5;border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;}
.modal-err.show{display:block;}
.modal-ok{display:none;background:#D1FAE5;color:#047857;border:1px solid #A7F3D0;border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;}
.modal-ok.show{display:block;}
.hide{display:none;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--green);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:all .3s;z-index:100;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-t{font-weight:600;font-size:14px;}.toast-s{font-size:12px;color:var(--muted);}
@media(max-width:860px){.wrap{padding:20px;}.cards{grid-template-columns:repeat(2,1fr);}.topbar{padding:12px 18px;}.user-email{display:none;}table{font-size:12px;}th,td{padding:8px;}}

/* ── MATCHING TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(243,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:15px;height:15px;}
.logo em{color:var(--sage);font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:14px;}
.role-pill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px;font-family:var(--mono);}
.role-pill.earner{background:var(--green-soft);color:var(--green);}
.role-pill.advertiser{background:var(--sage-soft);color:var(--sage-d);}
.role-pill.admin{background:var(--gold-soft);color:var(--gold-d);}
.user-email{font-size:13px;color:var(--muted);}
.btn-out{background:transparent;border:1.5px solid var(--border2);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);transition:.15s;}
.btn-out:hover{border-color:var(--sage);color:var(--sage);}

<body>
<div class="topbar">
  <a class="logo" href="index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></span>Wait<em>JI</em> AI · Admin</a>
  <div class="topbar-r"><span class="role-pill">ADMIN</span><span class="user-email" id="userEmail">—</span><button class="btn-out" onclick="logout()">Log out</button></div>
</div>
<div class="wrap">
  <h1 class="page-h">Platform control</h1>
  <p class="page-sub">Full visibility into advertisers, earners, campaigns & security</p>
<div class="admin-shell">
  <nav class="admin-sidebar">
    <div class="nav-group">
      <div class="nav-group-label">Overview</div>
      <button class="tab active" data-tab="overview" onclick="showTab('overview')">📊 Overview</button>
      <button class="tab" data-tab="revenue" onclick="showTab('revenue')">💰 Revenue</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">People</div>
      <button class="tab" data-tab="advertisers" onclick="showTab('advertisers')">🏢 Advertisers</button>
      <button class="tab" data-tab="customers" onclick="showTab('customers')">👤 Earners</button>
      <button class="tab" data-tab="withdrawals" onclick="showTab('withdrawals')">💸 Withdrawals <span id="pendingBadge" style="display:none;background:#EF4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:100px;margin-left:4px">0</span></button>
      <button class="tab" data-tab="disputes" onclick="showTab('disputes')">⚖️ Disputes</button>
      <button class="tab" data-tab="subadmins" onclick="showTab('subadmins')">🔑 Sub-Admins</button>
      <button class="tab" data-tab="crm" onclick="showTab('crm')">🗂️ Users (CRM)</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">Campaigns &amp; Ads</div>
      <button class="tab" data-tab="campaigns" onclick="showTab('campaigns')">📣 Campaigns</button>
      <button class="tab" data-tab="houseads" onclick="showTab('houseads')">🏠 House Ads</button>
      <button class="tab" data-tab="tracking" onclick="showTab('tracking')">📡 Ad Tracking</button>
      <button class="tab" data-tab="discounts" onclick="showTab('discounts')">🏷️ Discount Codes</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">Growth</div>
      <button class="tab" data-tab="waitlist" onclick="showTab('waitlist')">📧 Waitlist</button>
      <button class="tab" data-tab="careers" onclick="showTab('careers')">💼 Applications</button>
      <button class="tab" data-tab="jobs" onclick="showTab('jobs')">📋 Job Listings</button>
      <button class="tab" data-tab="email" onclick="showTab('email')">✉️ Email Tools</button>
      <button class="tab" data-tab="social" onclick="showTab('social')">📱 Social &amp; Promo</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">Monitoring</div>
      <button class="tab" data-tab="live" onclick="showTab('live')">🟢 Live Sessions</button>
      <button class="tab" data-tab="auditlog" onclick="showTab('auditlog')">📋 Audit Log</button>
      <button class="tab" data-tab="security" onclick="showTab('security')">🛡️ Security</button>
      <button class="tab" data-tab="ipblock" onclick="showTab('ipblock')">🚫 IP Block</button>
    </div>
  </nav>
  <div class="admin-main">
    <div id="tabContent"><div class="loading">Loading…</div></div>
  </div>
</div>
</div>
<div class="toast" id="toast"><div class="toast-t" id="toastT">Done</div><div class="toast-s" id="toastS"></div></div>

<script>
const API='https://waitjiai-backend.onrender.com';
const token=localStorage.getItem('waitji_token');
const role=localStorage.getItem('waitji_role');
if(!token||role!=='admin'){ window.location.href='login.html'; }
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
function logout(){ localStorage.clear(); window.location.href='login.html'; }
function toast(t,s){ document.getElementById('toastT').textContent=t; document.getElementById('toastS').textContent=s||''; const el=document.getElementById('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3500); }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function payoutMethodLabel(u){
  const pm=u.payoutMethod;
  if(pm?.type==='upi') return 'UPI — '+esc(pm.upiId||'');
  if(pm?.type==='bank') return 'Bank •••• '+esc(pm.last4||'');
  if(pm?.type==='paypal') return 'PayPal — '+esc(pm.paypalEmail||'');
  return 'Not set';
}

let curTab='overview';
async function init(){
  try{ const meR=await fetch(API+'/v1/auth/me',{headers:H}); if(!meR.ok){logout();return;} const me=(await meR.json()).user; document.getElementById('userEmail').textContent=me.email; showTab('overview'); }
  catch(e){ document.getElementById('tabContent').innerHTML='<div class="loading">Backend waking up… <a href="" onclick="location.reload();return false">retry</a></div>'; }
}
function showTab(t){ curTab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }

async function render(){
  const c=document.getElementById('tabContent');
  c.innerHTML='<div class="loading">Loading…</div>';
  get('/v1/admin/withdrawals').then(d=>{
    const b=document.getElementById('pendingBadge');
    if(d?.summary?.pending>0){b.style.display='inline';b.textContent=d.summary.pending;}else b.style.display='none';
  }).catch(()=>{});
  try{
    if(curTab==='overview')   return renderOverview(await get('/v1/admin/overview'));
    if(curTab==='revenue')    return renderRevenue(await get('/v1/admin/revenue-dashboard'));
    if(curTab==='disputes')   return renderDisputes(await get('/v1/admin/disputes'));
    if(curTab==='security')   return renderSecurity(await get('/v1/admin/security'));
    if(curTab==='campaigns')  return renderCampaigns((await get('/v1/admin/campaigns')).campaigns);
    if(curTab==='advertisers')return renderAdvertisers(await get('/v1/admin/advertisers'));
    if(curTab==='customers')  return renderCustomers(await get('/v1/admin/customers'));
    if(curTab==='withdrawals')return renderWithdrawals(await get('/v1/admin/withdrawals'));
    if(curTab==='discounts')  return renderDiscounts(await get('/v1/admin/discount-codes'));
    if(curTab==='waitlist')   return renderWaitlist(await get('/v1/admin/waitlist'));
    if(curTab==='careers')    return renderCareers(await get('/v1/admin/careers'));
    if(curTab==='jobs')       return renderJobs(await get('/v1/admin/jobs'));
    if(curTab==='houseads')   return renderHouseAds((await get('/v1/admin/house-ads')).houseAds);
    if(curTab==='tracking')   return renderTracking(await get('/v1/admin/overview'));
    if(curTab==='email')      return renderEmail(await get('/v1/admin/waitlist'));
    if(curTab==='social')     return renderSocial();
    if(curTab==='live')      return renderLive(await get('/v1/admin/live-sessions'));
    if(curTab==='auditlog')  return renderAuditLog(await get('/v1/admin/audit-log'));
    if(curTab==='ipblock')   return renderIpBlock(await get('/v1/admin/ip-block'));
    if(curTab==='subadmins') return renderSubAdmins(await get('/v1/admin/sub-admins'));
    if(curTab==='crm') return renderCrm();
  }catch(e){ document.getElementById('tabContent').innerHTML='<div class="loading">Error loading data. <a href="" onclick="render();return false">retry</a></div>'; console.error(e); }
}

async function get(url){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),10000); try{ const r=await fetch(API+url,{headers:H,signal:ac.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); } catch(e){ clearTimeout(t); throw e; } }
async function post(url,body){ const r=await fetch(API+url,{method:'POST',headers:H,body:JSON.stringify(body)}); return r.json(); }
async function ptch(url,body){ const r=await fetch(API+url,{method:'PATCH',headers:H,body:JSON.stringify(body)}); return r.json(); }
async function del(url){ const r=await fetch(API+url,{method:'DELETE',headers:H}); return r.json(); }
function c(){ return document.getElementById('tabContent'); }

// ── HOUSE ADS ──────────────────────────────────────────────────────────────
function renderHouseAds(ads){
  const el=c();
  el.innerHTML=`<div class="panel"><div class="panel-h">🏠 House Ads <button class="mini-btn green" onclick="addHouseAd()">+ Add</button></div>
  <table><thead><tr><th>Ad Text</th><th>URL</th><th>Status</th><th>Actions</th></tr></thead><tbody>
  ${(ads||[]).map(a=>`<tr>
    <td>${esc(a.text)}</td>
    <td><span class="mono">${esc(a.url||'').slice(0,40)}</span></td>
    <td><span class="status ${a.active?'active':'paused'}">${a.active?'Active':'Paused'}</span></td>
    <td>
      <button class="mini-btn" onclick="toggleHouseAd('${a.id}',${!a.active})">${a.active?'Pause':'Activate'}</button>
      <button class="mini-btn red" onclick="deleteHouseAd('${a.id}')">Delete</button>
    </td>
  </tr>`).join('')||'<tr><td colspan="4" class="empty">No house ads</td></tr>'}
  </tbody></table></div>`;
}
async function addHouseAd(){
  const text=prompt('Ad text (shown in spinner):'); if(!text) return;
  const url=prompt('Click URL:'); if(!url) return;
  await post('/v1/admin/house-ads',{text,url,active:true});
  toast('✓ House ad added'); render();
}
async function toggleHouseAd(id,active){
  await ptch('/v1/admin/house-ads/'+id,{active});
  toast('✓ Updated'); render();
}
async function deleteHouseAd(id){
  if(!confirm('Delete this house ad?')) return;
  await del('/v1/admin/house-ads/'+id);
  toast('✓ Deleted'); render();
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────
function renderOverview(d){
  const el=c();
  const s=d.summary||{};
  el.innerHTML=`
  <div class="cards">
    <div class="card"><div class="card-label">Total Impressions</div><div class="card-val">${fmt(s.totalImpressions||0)}</div><div class="card-sub">all time</div></div>

function fmt(n){return Number(n||0).toLocaleString('en-IN');}
function fmtRs(p){return '₹'+((p||0)/100).toFixed(2);}

function openWdDecision(id, action){
  const isApprove = action==='approve';
  const modal=document.createElement('div');
  modal.className='modal-overlay';
  modal.onclick=(e)=>{ if(e.target===modal) modal.remove(); };
  modal.innerHTML=`<div class="modal-box" style="max-width:440px;">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:4px;">${isApprove?'✓ Approve':'✗ Reject'} withdrawal</h3>
    <p style="font-size:12.5px;color:#6B6B7D;margin-bottom:14px;">${isApprove?'Add an optional note for your own records — the earner will see it if a payment issue comes up.':'This reason will be emailed to the earner, so keep it clear.'}</p>
    <textarea id="wdRemark" placeholder="${isApprove?'Optional remark…':'Reason for rejection (required)…'}" style="width:100%;min-height:80px;padding:10px 12px;border:1px solid #DEDCE8;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;"></textarea>
    <div id="wdRemarkErr" style="color:#DC2626;font-size:12px;margin-top:4px;"></div>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end;">
      <button class="mini-btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="mini-btn ${isApprove?'green':'red'}" onclick="submitWdDecision('${id}','${action}')">${isApprove?'Approve & Pay':'Confirm Reject'}</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('wdRemark').focus();
}
async function submitWdDecision(id, action){
  const remark=document.getElementById('wdRemark').value.trim();
  const errEl=document.getElementById('wdRemarkErr');
  if(action==='reject' && !remark){ errEl.textContent='A reason is required to reject.'; return; }
  const path = action==='approve' ? `/v1/admin/withdrawals/${id}/approve` : `/v1/admin/withdrawals/${id}/reject`;
  const body = action==='approve' ? {note:remark} : {reason:remark};
  const r=await post(path, body);
  document.querySelector('.modal-overlay')?.remove();
  if(r.error){toast('⚠️ '+r.error);return;}
  toast(action==='approve'?(r.autoPaid?'⚡ Auto-paid via Cashfree':'✓ Approved — manual pay needed'):'✓ Rejected');
  render();
}

async function createDiscount(){
  const code=document.getElementById('dcCode').value.trim().toUpperCase();

  if(!code){toast('Enter a code');return;}
  const r=await post('/v1/admin/discount-codes',{code,discountPct:pct,maxUses:max,expiresInDays:days});
  toast(r.code?'✓ Code created: '+r.code.code:'⚠️ '+(r.error||'Failed')); render();
}

}
async function sendWaitlistEmail(all=false){
  const subject=document.getElementById('wlSubject')?.value.trim();
  const body=document.getElementById('wlBody')?.value.trim();
  const err=document.getElementById('wErr'); const ok=document.getElementById('wOk');
  err.classList.remove('show'); ok.classList.remove('show');
  if(!subject||!body){err.textContent='Enter subject and body.';err.classList.add('show');return;}
  const _sendBtn1=document.activeElement||document.querySelector('[onclick*="sendWaitlistEmail"]');
  if(_sendBtn1){_sendBtn1.disabled=true; _sendBtn1.textContent='Sending…';}
  try{
    const r=await fetch(API+'/v1/admin/waitlist/send-email',{method:'POST',headers:H,body:JSON.stringify({subject,body,sendToAll:all})});
    const d=await r.json();
    if(r.ok){ok.textContent='✓ Sent to '+d.sent+' of '+d.attempted+' recipients.';ok.classList.add('show');toast('✓ Sent '+d.sent+' emails');}
    else{err.textContent=d.error||'Server error';err.classList.add('show');}
  }catch(e){err.textContent='Network error: '+e.message;err.classList.add('show');}
  btn.disabled=false; btn.textContent=all?'Send to all':'Send to non-joined';
}

async function blockIp(){
  const ip=prompt('IP address to block:'); if(!ip) return;
  const reason=prompt('Reason (e.g. click fraud, spam):') || 'Manual block';
  const r=await fetch(API+'/v1/admin/ip-block',{method:'POST',headers:H,body:JSON.stringify({ip,reason})});
  if((await r.json()).success){toast('✓ IP blocked');render();}
}
async function unblockIp(ip){
  if(!confirm('Unblock '+ip+'?')) return;
  await del('/v1/admin/ip-block/'+encodeURIComponent(ip));
  toast('✓ Unblocked'); render();
}

async function saveJob(id){
  const title=document.getElementById('jTitle')?.value.trim();
  const description=document.getElementById('jDesc')?.value.trim();
  if(!title||!description){toast('Title & description required');return;}
  const body={title,type:document.getElementById('jType')?.value,location:document.getElementById('jLocation')?.value.trim(),description,requirements:document.getElementById('jReqs')?.value.trim(),tags:document.getElementById('jTags')?.value.split(',').map(t=>t.trim()).filter(Boolean),active:document.getElementById('jActive')?.checked};
  const r=id?await ptch('/v1/admin/jobs/'+id,body):await fetch(API+'/v1/admin/jobs',{method:'POST',headers:H,body:JSON.stringify(body)}).then(r=>r.json());
  toast(r.job?'✓ Saved':'⚠️ '+(r.error||'Failed')); document.querySelector('.modal-bg')?.remove(); render();
}
async function toggleJob(id,active){ await ptch('/v1/admin/jobs/'+id,{active}); toast(active?'✓ Job shown':'✓ Job hidden'); render(); }

function prefillEmail(template){

async function sendBulkEmail(){
  const subject=document.getElementById('emailSubject')?.value.trim();
  const body=document.getElementById('emailBody')?.value.trim();
  const audience=document.getElementById('emailAudience')?.value;
  const single=document.getElementById('singleEmail')?.value.trim();
  const err=document.getElementById('emailErr'); const ok=document.getElementById('emailOk');
  err.classList.remove('show'); ok.classList.remove('show');
  if(!subject||!body){err.textContent='Subject and body required.';err.classList.add('show');return;}
  const _sendBtn2=document.activeElement||document.querySelector('[onclick*="sendBulkEmail"]');
  if(_sendBtn2){_sendBtn2.disabled=true; _sendBtn2.textContent='Sending…';}
  try{
    const endpoint=audience==='waitlist-not-joined'||audience==='waitlist-all'?'/v1/admin/waitlist/send-email':'/v1/admin/send-email';
    const r=await fetch(API+endpoint,{method:'POST',headers:H,body:JSON.stringify({subject,body,audience,singleEmail:single,sendToAll:audience==='waitlist-all'})});
    const d=await r.json();
    if(r.ok){ok.textContent='✓ Sent to '+(d.sent||'—')+' recipient(s).';ok.classList.add('show');toast('✓ Email sent');}
    else{err.textContent=d.error||'Server error';err.classList.add('show');}
  }catch(e){err.textContent='Network error';err.classList.add('show');}
  if(_sendBtn2){_sendBtn2.disabled=false; _sendBtn2.textContent='Send email →';}
}
