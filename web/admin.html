<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitJI AI — Admin Panel</title>

<style>
:root{
  --ink:#0B0F0A;--ink2:#1C2119;
  --sage:#2A7A4F;--sage-d:#1E5A3A;--sage-l:#3D9E68;--sage-soft:#EBF5EE;
  --gold:#F0B429;--gold-d:#C9901A;--gold-l:#F7D070;--gold-soft:#FEF9EC;
  --cream:#F8F5EE;--cream2:#EEE9DD;
  --muted:#6B7568;--muted2:#9AA896;
  --border:#D4D9CF;--border2:#BFC5B9;
  --surface:#FFFFFF;--surface2:#F8F5EE;--bg:#F3F0E8;
  --red:#DC2626;--red-soft:#FEE2E2;
  --green:#15803D;--green-soft:#DCFCE7;
  --amber:#D97706;--amber-soft:#FEF3C7;
  /* backward compat aliases */
  --indigo:var(--sage);--indigo-dark:var(--sage-d);--indigo-soft:var(--sage-soft);
  --sky:var(--sage-l);
  --display:'Sora',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Sora',sans-serif;
  --shadow-sm:0 1px 3px rgba(11,15,10,.06);
  --shadow:0 4px 24px rgba(11,15,10,.10);
}
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--ink);border-bottom:1px solid #1A1F3D;}
.logo{font-family:var(--mono);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--sage),var(--sky));display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:17px;height:17px;}.logo em{color:#3D9E68;font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:14px;}
.role-pill{font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;background:rgba(129,140,248,.2);color:#A5B4FC;font-family:var(--mono);}
.user-email{font-size:13px;color:#9AA0B4;}
.btn-out{background:transparent;border:1px solid #2A2F4D;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);}
.btn-out:hover{border-color:#3D9E68;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:28px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
.modal h2{font-family:var(--sans);font-size:19px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.modal-actions{display:flex;gap:10px;}
.modal table th,.modal table td{padding:7px 8px;border-bottom:1px solid var(--border2);}
.wrap{max-width:1180px;margin:0 auto;padding:32px;}
.page-h{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.tabs{display:flex;gap:6px;margin-bottom:26px;background:var(--surface);padding:6px;border-radius:13px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;}
.tab.active{background:var(--indigo);color:#fff;}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
.card.danger{background:var(--red-soft);border-color:#FCA5A5;}
.card.safe{background:var(--green-soft);border-color:#A7F3D0;}
.card-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px;}
.danger .card-label{color:#B91C1C;}.safe .card-label{color:#047857;}
.card-val{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-1px;}
.danger .card-val{color:#B91C1C;}.safe .card-val{color:#047857;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:3px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
.panel-h{font-family:var(--sans);font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);font-size:12px;}
.status{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;}
.status.active{background:var(--green-soft);color:#047857;}
.status.pending{background:var(--amber-soft);color:#92400E;}
.status.paused{background:var(--surface2);color:var(--muted);}
.status.rejected{background:var(--red-soft);color:#B91C1C;}
.status.completed{background:var(--indigo-soft);color:var(--indigo);}
.sev{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600;}
.sev.critical{background:var(--red);color:#fff;}
.sev.high{background:var(--red-soft);color:#B91C1C;}
.sev.medium{background:var(--amber-soft);color:#92400E;}
.mini-btn{background:var(--surface2);border:1px solid var(--border2);padding:5px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-family:var(--body);font-weight:600;color:var(--ink2);margin-right:5px;}
.mini-btn:hover{border-color:var(--indigo);color:var(--indigo);}
.mini-btn.green{color:#047857;border-color:#A7F3D0;}.mini-btn.green:hover{background:var(--green-soft);}
.mini-btn.red{color:#B91C1C;border-color:#FCA5A5;}.mini-btn.red:hover{background:var(--red-soft);}
.empty{text-align:center;padding:46px;color:var(--muted2);}
.empty-ic{font-size:34px;margin-bottom:10px;}
.fraud-types{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.ftype{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;}
.ftype b{font-family:var(--mono);color:var(--red);font-size:15px;display:block;}
.thresholds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px;}
.thresh{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.thresh-k{font-size:11px;color:var(--muted);}
.thresh-v{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--indigo);}
.loading{text-align:center;padding:60px;color:var(--muted2);font-family:var(--mono);}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);}
.modal-err{display:none;background:#FEE2E2;color:#B91C1C;border:1px solid #FCA5A5;border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;}
.modal-err.show{display:block;}
.modal-ok{display:none;background:#D1FAE5;color:#047857;border:1px solid #A7F3D0;border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;}
.modal-ok.show{display:block;}
.hide{display:none;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--green);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:all .3s;z-index:100;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-t{font-weight:600;font-size:14px;}.toast-s{font-size:12px;color:var(--muted);}
@media(max-width:860px){.wrap{padding:20px;}.cards{grid-template-columns:repeat(2,1fr);}.topbar{padding:12px 18px;}.user-email{display:none;}table{font-size:12px;}th,td{padding:8px;}}

/* ── MATCHING TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(243,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:15px;height:15px;}
.logo em{color:var(--sage);font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:14px;}
.role-pill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px;font-family:var(--mono);}
.role-pill.earner{background:var(--green-soft);color:var(--green);}
.role-pill.advertiser{background:var(--sage-soft);color:var(--sage-d);}
.role-pill.admin{background:var(--gold-soft);color:var(--gold-d);}
.user-email{font-size:13px;color:var(--muted);}
.btn-out{background:transparent;border:1.5px solid var(--border2);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);transition:.15s;}
.btn-out:hover{border-color:var(--sage);color:var(--sage);}

</style>

<body>
<div class="topbar">
  <a class="logo" href="index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></span>Wait<em>JI</em> AI · Admin</a>
  <div class="topbar-r"><span class="role-pill">ADMIN</span><span class="user-email" id="userEmail">—</span><button class="btn-out" onclick="logout()">Log out</button></div>
</div>
<div class="wrap">
  <h1 class="page-h">Platform control</h1>
  <p class="page-sub">Full visibility into advertisers, earners, campaigns & security</p>
  <div class="tabs">
    <button class="tab active" data-tab="overview" onclick="showTab('overview')">Overview</button>
    <button class="tab" data-tab="security" onclick="showTab('security')">🛡️ Security</button>
    <button class="tab" data-tab="campaigns" onclick="showTab('campaigns')">Campaigns</button>
    <button class="tab" data-tab="advertisers" onclick="showTab('advertisers')">Advertisers</button>
    <button class="tab" data-tab="customers" onclick="showTab('customers')">Earners</button>
    <button class="tab" data-tab="withdrawals" onclick="showTab('withdrawals')">💸 Withdrawals <span id="pendingBadge" style="display:none;background:#EF4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:100px;margin-left:4px">0</span></button>
    <button class="tab" data-tab="discounts" onclick="showTab('discounts')">🏷️ Discount Codes</button>
    <button class="tab" data-tab="waitlist" onclick="showTab('waitlist')">📧 Waitlist</button>
    <button class="tab" data-tab="careers" onclick="showTab('careers')">💼 Applications</button>
    <button class="tab" data-tab="jobs" onclick="showTab('jobs')">📋 Job Listings</button>
    <button class="tab" data-tab="houseads" onclick="showTab('houseads')">🏠 House Ads</button>
  </div>
  <div id="tabContent"><div class="loading">Loading…</div></div>
</div>
<div class="toast" id="toast"><div class="toast-t" id="toastT">Done</div><div class="toast-s" id="toastS"></div></div>

<script>
const API='https://waitjiai-backend.onrender.com';
const token=localStorage.getItem('waitji_token');
const role=localStorage.getItem('waitji_role');
if(!token||role!=='admin'){ window.location.href='login.html'; }
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
function logout(){ localStorage.clear(); window.location.href='login.html'; }
function toast(t,s){ document.getElementById('toastT').textContent=t; document.getElementById('toastS').textContent=s||''; const el=document.getElementById('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3500); }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let curTab='overview';
async function init(){
  try{ const meR=await fetch(API+'/v1/auth/me',{headers:H}); if(!meR.ok){logout();return;} const me=(await meR.json()).user; document.getElementById('userEmail').textContent=me.email; showTab('overview'); }
  catch(e){ document.getElementById('tabContent').innerHTML='<div class="loading">Backend waking up… <a href="" onclick="location.reload();return false">retry</a></div>'; }
}
function showTab(t){ curTab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }

async function render(){
  const c=document.getElementById('tabContent'); c.innerHTML='<div class="loading">Loading…</div>';
  // Always refresh withdrawal badge regardless of active tab
  get('/v1/admin/withdrawals').then(d=>{
    const badge=document.getElementById('pendingBadge');
    if(d?.summary?.pending>0){badge.style.display='inline';badge.textContent=d.summary.pending;}
    else badge.style.display='none';
  }).catch(()=>{});
  try{
    if(curTab==='overview') return renderOverview(await get('/v1/admin/overview'));
    if(curTab==='security') return renderSecurity(await get('/v1/admin/security'));
    if(curTab==='campaigns') return renderCampaigns((await get('/v1/admin/campaigns')).campaigns);
    if(curTab==='advertisers') return renderAdvertisers((await get('/v1/admin/advertisers')).advertisers);
    if(curTab==='customers') return renderCustomers((await get('/v1/admin/customers')).customers);
    if(curTab==='waitlist') return renderWaitlist(await get('/v1/admin/waitlist'));
    if(curTab==='withdrawals') return renderWithdrawals(await get('/v1/admin/withdrawals'));
    if(curTab==='discounts') return renderDiscounts(await get('/v1/admin/discount-codes'));
    if(curTab==='careers') return renderCareers(await get('/v1/admin/careers'));
    if(curTab==='jobs') return renderJobs(await get('/v1/admin/jobs'));
    if(curTab==='houseads') return renderHouseAds((await get('/v1/admin/house-ads')).houseAds);
  }catch(e){ c.innerHTML='<div class="loading">Error loading data. <a href="" onclick="location.reload();return false">retry</a></div>'; }
}
async function get(p){ const r=await fetch(API+p,{headers:H}); return r.json(); }

function renderHouseAds(ads){
  document.getElementById('tabContent').innerHTML=`
    <div class="panel" style="background:var(--indigo-soft);border-color:#C7D2FE">
      <strong>What this does:</strong> When there's no active advertiser campaign, the extension shows one of these instead — so developers still see (and earn ₹50/1000 impressions from, founder-funded) something during Claude Code's thinking pause. The moment a real advertiser campaign goes active, it always takes priority over these automatically.
    </div>
    <div class="panel">
      <div class="panel-h">Add a house ad</div>
      <div class="field"><label>Ad text</label><input id="haText" placeholder="WaitJI AI · your message here" style="width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:9px;margin-top:6px"></div>
      <div class="field" style="margin-top:12px"><label>Link URL</label><input id="haUrl" placeholder="https://..." style="width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:9px;margin-top:6px"></div>
      <div class="modal-err" id="haErr" style="margin-top:14px"></div>
      <button class="mini-btn" style="margin-top:14px;padding:10px 18px" onclick="addHouseAd()">+ Add house ad</button>
    </div>
    <div class="panel">
      <div class="panel-h">Current house ads (${ads.length})</div>
      ${ads.length?`<table><thead><tr><th>Text</th><th>URL</th><th>Status</th><th></th></tr></thead><tbody>
      ${ads.map(a=>`<tr><td>${esc(a.text)}</td><td class="mono" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(a.url)}</td><td><span class="status ${a.active?'active':'paused'}">${a.active?'active':'paused'}</span></td><td><button class="mini-btn" onclick="toggleHouseAd('${a.id}',${!a.active})">${a.active?'Pause':'Activate'}</button> <button class="mini-btn red" onclick="deleteHouseAd('${a.id}')">Delete</button></td></tr>`).join('')}
      </tbody></table>`:`<div class="empty"><div class="empty-ic">🏠</div>No house ads configured — developers will see nothing when there's no active advertiser.</div>`}
    </div>`;
}
async function addHouseAd(){
  const text=document.getElementById('haText').value.trim();
  const url=document.getElementById('haUrl').value.trim();
  const err=document.getElementById('haErr');
  err.classList.remove('show');
  if(!text||!url){ err.textContent='Both text and URL are required'; err.classList.add('show'); return; }
  const r=await fetch(API+'/v1/admin/house-ads',{method:'POST',headers:H,body:JSON.stringify({text,url})});
  if(r.ok){ toast('✓ House ad added'); render(); }
  else{ const d=await r.json().catch(()=>({})); err.textContent=d.error||'Could not add'; err.classList.add('show'); }
}
async function toggleHouseAd(id,active){
  await fetch(API+'/v1/admin/house-ads/'+id,{method:'PATCH',headers:H,body:JSON.stringify({active})});
  toast(active?'✓ Activated':'⏸ Paused'); render();
}
async function deleteHouseAd(id){
  if(!confirm('Delete this house ad permanently?')) return;
  await fetch(API+'/v1/admin/house-ads/'+id,{method:'DELETE',headers:H});
  toast('🗑 Deleted'); render();
}

function renderOverview(d){
  document.getElementById('tabContent').innerHTML=`
    <div class="cards">
      <div class="card"><div class="card-label">Total registered users</div><div class="card-val">${d.totalRegisteredUsers}</div><div class="card-sub">${d.advertisers} advertisers · ${d.customers} earners</div></div>
      <div class="card safe"><div class="card-label">Active users (7d)</div><div class="card-val">${d.activeUsers7d}</div><div class="card-sub">used the platform recently</div></div>
      <div class="card"><div class="card-label">⚡ Extension installs</div><div class="card-val">${d.extensionInstalls!=null?d.extensionInstalls.toLocaleString('en-IN'):'—'}</div><div class="card-sub">${d.extensionInstalls!=null?'live from VS Code Marketplace':'marketplace data unavailable'}</div></div>
      <div class="card danger"><div class="card-label">🛡️ Fraud flags</div><div class="card-val">${d.fraudFlags}</div><div class="card-sub">${d.blockedClicks} clicks blocked</div></div>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">Advertisers</div><div class="card-val">${d.advertisers}</div><div class="card-sub">${d.campaigns} campaigns</div></div>
      <div class="card"><div class="card-label">Active campaigns</div><div class="card-val">${d.activeCampaigns}</div><div class="card-sub">${d.pendingCampaigns} pending review</div></div>
      <div class="card safe"><div class="card-label">Platform revenue</div><div class="card-val">₹${d.platformRevenueRupees}</div><div class="card-sub">50% take rate</div></div>
      <div class="card"><div class="card-label">Payouts owed</div><div class="card-val">₹${d.payoutsOwedRupees}</div><div class="card-sub">to earners</div></div>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">Valid clicks</div><div class="card-val">${d.validClicks}</div><div class="card-sub">billed to advertisers</div></div>
      <div class="card"><div class="card-label">Banned users</div><div class="card-val">${d.bannedUsers}</div><div class="card-sub">policy enforcement</div></div>
    </div>
    ${d.pendingCampaigns>0?`<div class="panel" style="background:var(--amber-soft);border-color:#FDE68A"><div class="panel-h">⏳ ${d.pendingCampaigns} campaign(s) awaiting review</div><button class="mini-btn" onclick="showTab('campaigns')">Review now →</button></div>`:''}`;
}

function renderSecurity(d){
  document.getElementById('tabContent').innerHTML=`
    <div class="cards">
      <div class="card danger"><div class="card-label">Total fraud flags</div><div class="card-val">${d.flags.length}</div><div class="card-sub">lifetime</div></div>
      <div class="card danger"><div class="card-label">Blocked clicks</div><div class="card-val">${d.blockedClicks}</div><div class="card-sub">invalid / fraudulent</div></div>
      <div class="card safe"><div class="card-label">💰 Advertiser money saved</div><div class="card-val">₹${d.moneySavedRupees}</div><div class="card-sub">fraud never billed</div></div>
      <div class="card"><div class="card-label">Fraud types</div><div class="card-val">${Object.keys(d.byType).length}</div><div class="card-sub">detection rules firing</div></div>
    </div>
    <div class="panel">
      <div class="panel-h">🛡️ Active detection thresholds</div>
      <div class="thresholds">
        <div class="thresh"><div class="thresh-k">Max clicks / min</div><div class="thresh-v">${d.thresholds.MAX_CLICKS_PER_MIN}</div></div>

function timeAgo(ts){
  const diff=Date.now()-ts;
  const min=Math.floor(diff/60000);
  if(min<1) return 'just now';
  if(min<60) return min+'m ago';
  const hr=Math.floor(min/60);
  if(hr<24) return hr+'h ago';
  return Math.floor(hr/24)+'d ago';
}

async function approveWithdrawal(id){
  const note = prompt('Optional note to developer (e.g. "Payment sent to your UPI"):', '');
  if(note === null) return; // cancelled
  const r = await fetch(API+'/v1/admin/withdrawals/'+id+'/approve', {method:'POST',headers:H,body:JSON.stringify({note: note.trim()||null})});
  const d = await r.json();
  if(r.ok){ toast('✅ Withdrawal approved — developer notified by email'); showTab('withdrawals'); }
  else toast('⚠️ '+(d.error||'Could not approve'));
}

async function rejectWithdrawal(id){
  const reason = prompt('Reason for rejection (will be sent to developer by email):');
  if(!reason || !reason.trim()){ if(reason!==null) toast('⚠️ Reason is required for rejection'); return; }
  const r = await fetch(API+'/v1/admin/withdrawals/'+id+'/reject', {method:'POST',headers:H,body:JSON.stringify({reason: reason.trim()})});
  const d = await r.json();
  if(r.ok){ toast('Withdrawal rejected — developer notified by email'); showTab('withdrawals'); }
  else toast('⚠️ '+(d.error||'Could not reject'));
}

async function sendLaunchEmail(){
  const subject=document.getElementById('wSubject').value.trim();
  const html=document.getElementById('wHtml').value;
  const force=document.getElementById('wForce').checked;
  const err=document.getElementById('wErr');
  err.classList.remove('show'); err.textContent='';
  const ok=document.getElementById('wOk');
  if(ok){ ok.classList.remove('show'); ok.textContent=''; }
  if(!subject||!html){ err.textContent='Subject and email HTML are required'; err.classList.add('show'); return; }
  if(!confirm(force?'This will EMAIL EVERYONE on the waitlist again, including people already emailed. Continue?':'Send this email to everyone on the waitlist who hasn\'t been emailed yet. Continue?')) return;
  const btn=document.getElementById('wSendBtn'); btn.disabled=true; btn.textContent='Sending…';
  try{
    const r=await fetch(API+'/v1/admin/send-launch-email',{method:'POST',headers:H,body:JSON.stringify({subject,html,force})});
    let d=null; const raw=await r.text(); try{ d=JSON.parse(raw); }catch{ d=null; }
    if(r.ok && d){
      let msg='✓ Sent '+d.sent+' of '+d.attempted+' (total waitlist: '+d.totalWaitlist+')';
      if(d.failed && d.failed.length){
        msg += '. '+d.failed.length+' failed: '+d.failed.slice(0,3).map(f=>f.email+' — '+f.error).join('; ');
      }
      if(d.attempted===0) msg += '. Nothing to send — everyone already emailed (tick "Resend to everyone" to force).';
      document.getElementById('wOk').textContent=msg;
      document.getElementById('wOk').classList.add('show');
      toast('✓ Sent '+d.sent+' / '+d.attempted);
      render();
    } else {
      err.textContent = (d && d.error) ? d.error : ('Server returned ' + r.status + (raw ? ': ' + raw.slice(0,200) : ''));
      err.classList.add('show');
    }
  }catch(e){ err.textContent='Network error: '+e.message; err.classList.add('show'); }
  btn.disabled=false; btn.textContent='Send to waitlist →';
}

      <div style="margin-bottom:12px;"><label style="display:block;font-size:11px;font-weight:700;color:#6B7568;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;">Tags (comma-separated)</label>
        <input id="jTags" value="${esc((job?.tags||[]).join(', '))}" placeholder="remote, commission, internship" style="width:100%;background:#F8F5EE;border:1.5px solid #D4D9CF;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <input type="checkbox" id="jActive" ${(job?.active!==false)?'checked':''} style="width:16px;height:16px;cursor:pointer;">
        <label for="jActive" style="font-size:14px;font-weight:600;cursor:pointer;">Show on careers page (active)</label>
      </div>
    </div>
    <div style="padding:14px 24px;border-top:1px solid #E5E7EB;display:flex;gap:8px;">
      <button onclick="saveJob('${id||''}')" style="background:#2A7A4F;color:#fff;border:none;padding:11px 24px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;flex:1;">${job?'Save changes':'Add job listing'}</button>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="background:transparent;border:1.5px solid #D4D9CF;color:#374151;padding:11px 18px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
    </div>
  </div>`;
  m.addEventListener('click', e => { if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

async function saveJob(id){
  const title=document.getElementById('jTitle').value.trim();
  const type=document.getElementById('jType').value;
  const location=document.getElementById('jLocation').value.trim();
  const description=document.getElementById('jDesc').value.trim();
  const requirements=document.getElementById('jReqs').value.trim();
  const tagsRaw=document.getElementById('jTags').value;
  const active=document.getElementById('jActive').checked;
  const tags=tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);
  if(!title){toast('⚠️ Title is required');return;}
  if(!description){toast('⚠️ Description is required');return;}
  const body={title,type,location,description,requirements,tags,active};
  const url=id?API+'/v1/admin/jobs/'+id:API+'/v1/admin/jobs';
  const r=await fetch(url,{method:id?'PATCH':'POST',headers:H,body:JSON.stringify(body)});
  if(r.ok){
    toast(id?'✓ Job updated':'✓ Job added');
    document.querySelector('div[style*=fixed]')?.remove();
    render();
  } else {
    const d=await r.json().catch(()=>({}));
    toast('⚠️ '+(d.error||'Failed'));
  }
}

async function toggleJob(id,active){
  await fetch(API+'/v1/admin/jobs/'+id,{method:'PATCH',headers:H,body:JSON.stringify({active})});
  toast(active?'✓ Job shown on careers page':'✓ Job hidden');
  render();
}

async function deleteJob(id,title){
  if(!confirm('Delete "'+title+'"? This cannot be undone.')) return;
  const r=await fetch(API+'/v1/admin/jobs/'+id,{method:'DELETE',headers:H});
  if(r.ok){toast('✓ Job deleted');render();}
  else toast('⚠️ Failed to delete');
}
</script>
</body>
</html>
