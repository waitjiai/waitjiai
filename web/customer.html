<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaitJI AI — Earnings Dashboard</title>
<meta name="robots" content="noindex,nofollow">

<style>
:root{
  --ink:#0B0F0A;--ink2:#1C2119;
  --sage:#2A7A4F;--sage-d:#1E5A3A;--sage-l:#3D9E68;--sage-soft:#EBF5EE;
  --gold:#F0B429;--gold-d:#C9901A;--gold-l:#F7D070;--gold-soft:#FEF9EC;
  --cream:#F8F5EE;--cream2:#EEE9DD;
  --muted:#6B7568;--muted2:#9AA896;
  --border:#D4D9CF;--border2:#BFC5B9;
  --surface:#FFFFFF;--surface2:#F8F5EE;--bg:#F3F0E8;
  --red:#DC2626;--red-soft:#FEE2E2;
  --green:#15803D;--green-soft:#DCFCE7;
  --amber:#D97706;--amber-soft:#FEF3C7;
  /* backward compat aliases */
  --indigo:var(--sage);--indigo-dark:var(--sage-d);--indigo-soft:var(--sage-soft);
  --sky:var(--sage-l);
  --display:'Sora',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Sora',sans-serif;
  --shadow-sm:0 1px 3px rgba(11,15,10,.06);
  --shadow:0 4px 24px rgba(11,15,10,.10);
}
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--surface);border-bottom:1px solid var(--border);}
.logo{font-family:var(--mono);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--sage),var(--sage-l));display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:17px;height:17px;}
.logo em{color:var(--indigo);font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:14px;}

.user-email{font-size:13px;color:var(--muted);}
.btn-out{background:transparent;border:1px solid var(--border2);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);}
.btn-out:hover{border-color:var(--indigo);color:var(--indigo);}
.wrap{max-width:1080px;margin:0 auto;padding:32px;}
.page-h{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);font-family:var(--mono);font-weight:500;margin-left:10px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 5px rgba(16,185,129,0)}}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm);}
.card.hero-card{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));color:#fff;border:none;}
.card-label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px;}
.hero-card .card-label{color:rgba(255,255,255,.8);}
.card-val{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-1px;}
.card-sub{font-size:12px;color:var(--muted2);margin-top:4px;}
.hero-card .card-sub{color:rgba(255,255,255,.7);}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);}
.panel-h{font-family:var(--sans);font-size:16px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.activity{display:flex;flex-direction:column;gap:2px;max-height:380px;overflow-y:auto;}
.act-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.act-row:last-child{border-bottom:none;}
.act-ic{width:34px;height:34px;border-radius:9px;background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.act-tx{flex:1;}
.act-tx h4{font-size:13px;font-weight:600;}
.act-tx p{font-size:11px;color:var(--muted2);font-family:var(--mono);}
.act-amt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:600;}
.act-empty{text-align:center;padding:40px 20px;color:var(--muted2);font-size:13px;}
.upi-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
.upi-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.upi-val{font-family:var(--mono);font-size:15px;font-weight:600;}
.upi-input{display:flex;gap:8px;margin-top:8px;}
.upi-input input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:13px;outline:none;}
.upi-input input:focus{border-color:var(--indigo);}
.btn-solid{background:var(--sage);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);}
.btn-solid:hover{background:var(--sage-d);}
.btn-solid:disabled{opacity:.5;cursor:not-allowed;}
.btn-payout{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:4px;}
.ref-box{background:linear-gradient(135deg,var(--indigo-soft),#E0F2FE);border:1px solid #C7D2FE;border-radius:12px;padding:18px;margin-top:18px;}
.ref-box h4{font-size:14px;font-weight:600;margin-bottom:6px;}
.ref-box p{font-size:12px;color:var(--muted);margin-bottom:10px;}
.ref-link{display:flex;gap:8px;}
.ref-link input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:12px;outline:none;color:var(--ink2);}
.loading{text-align:center;padding:60px;color:var(--muted2);font-family:var(--mono);font-size:13px;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--green);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:all .3s;z-index:100;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-t{font-weight:600;font-size:14px;}
.toast-s{font-size:12px;color:var(--muted);}
@media(max-width:860px){.wrap{padding:20px;}.cards{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}.topbar{padding:12px 18px;}.user-email{display:none;}}

/* ── MATCHING TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(243,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{font-family:var(--mono);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:15px;height:15px;}
.logo em{color:var(--sage);font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:14px;}
.role-pill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px;font-family:var(--mono);}
.role-pill.earner{background:var(--green-soft);color:var(--green);}
.role-pill.advertiser{background:var(--sage-soft);color:var(--sage-d);}
.role-pill.admin{background:var(--gold-soft);color:var(--gold-d);}
.user-email{font-size:13px;color:var(--muted);}
.btn-out{background:transparent;border:1.5px solid var(--border2);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);transition:.15s;}
.btn-out:hover{border-color:var(--sage);color:var(--sage);}

</style>

  <link rel="icon" type="image/png" sizes="512x512" href="logo-512.png">
  <link rel="shortcut icon" href="logo-192.png">
  <link rel="apple-touch-icon" href="logo-192.png">

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LGNX0BPWPJ"></script>

</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/><path d="M12 3 A9 9 0 0 1 20 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></span>Wait<em>JI</em> AI</a>
  <div class="topbar-r">
    <span class="role-pill">EARNER</span>
    <span class="user-email" id="userEmail">—</span>
    <button class="btn-out" onclick="logout()">Log out</button>
  </div>
</div>

<div class="wrap" id="content">
  <div class="loading">Loading your dashboard…</div>
</div>

<div class="toast" id="toast"><div class="toast-t" id="toastT">Done</div><div class="toast-s" id="toastS"></div></div>

<script>
const API='https://waitjiai-backend.onrender.com';
const token=localStorage.getItem('waitji_token');
const role=localStorage.getItem('waitji_role');
if(!token||role!=='customer'){ window.location.href='login.html'; }
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};

function logout(){ localStorage.clear(); window.location.href='login.html'; }
function toast(t,s){ document.getElementById('toastT').textContent=t; document.getElementById('toastS').textContent=s||''; const el=document.getElementById('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3500); }

let me=null;
async function load(){
  try{
    const meR=await fetch(API+'/v1/auth/me',{headers:H});
    if(!meR.ok){ logout(); return; }
    me=(await meR.json()).user;
    document.getElementById('userEmail').textContent=me.email;
    const [eRes, aRes, wRes] = await Promise.all([
      fetch(API+'/v1/customer/earnings',{headers:H}),
      fetch(API+'/v1/customer/activity',{headers:H}),
      fetch(API+'/v1/customer/withdrawals',{headers:H}),
    ]);
    const e=await eRes.json();
    const a=await aRes.json();
    const w=await wRes.json();
    render(e, a.activity||[], w.withdrawals||[]);
  }catch(err){ document.getElementById('content').innerHTML='<div class="loading">Backend waking up… <a href="" onclick="location.reload();return false">retry</a></div>'; }
}

function render(e,activity,withdrawals){
  const hasPendingWithdrawal = withdrawals.some(w=>w.status==='pending');
  const ps = me.profileStatus || {complete:false,missing:[],checks:{}};
  const refLink=`https://waitjiai.in/r/${me.id}`;

  document.getElementById('content').innerHTML=`
    <h1 class="page-h">Welcome back${me.name?', '+me.name:''} 👋</h1>
    <p class="page-sub">Your earnings update in real time as you code<span class="live-tag"><span class="live-dot"></span>LIVE</span></p>

    ${!ps.complete ? `
    <div style="background:#FEF9EC;border:1.5px solid #FDE68A;border-radius:14px;padding:18px 20px;margin-bottom:20px">
      <div style="font-family:var(--mono);font-size:11px;font-weight:600;color:#D97706;letter-spacing:1px;margin-bottom:8px">⚠️ PROFILE INCOMPLETE — WITHDRAWAL BLOCKED</div>
      <p style="font-size:13.5px;color:#92400E;margin-bottom:10px">Complete your profile to unlock withdrawals. <b>${(ps.missing||[]).length} step${(ps.missing||[]).length===1?'':'s'} remaining.</b></p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${[
          {label:'Full name',done:ps.checks?.name?.done},
          {label:'Phone number',done:ps.checks?.phone?.done},
          {label:'Email verified',done:ps.checks?.email?.done},
          {label:'UPI / Bank verified',done:ps.checks?.payout?.done},
        ].map(c=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:100px;background:${c.done?'#DCFCE7':'#FEE2E2'};color:${c.done?'#047857':'#B91C1C'};font-weight:600">${c.done?'✓':'✗'} ${c.label}</div>`).join('')}
      </div>
    </div>` : `
    <div style="background:#DCFCE7;border:1px solid #86EFAC;border-radius:14px;padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:#047857;font-weight:600">✓ Profile complete — withdrawals enabled</div>`}

    <div class="cards">
      <div class="card hero-card"><div class="card-label">Total earned</div><div class="card-val">₹${e.totalEarnedRupees}</div><div class="card-sub">all time</div></div>
      <div class="card"><div class="card-label">Today</div><div class="card-val" style="color:var(--green)">₹${e.todayRupees}</div><div class="card-sub">last 24 hours</div></div>
      <div class="card"><div class="card-label">Available</div><div class="card-val">₹${e.pendingRupees}</div><div class="card-sub">min ₹100</div></div>
      <div class="card"><div class="card-label">Impressions</div><div class="card-val">${e.impressions.toLocaleString('en-IN')}</div><div class="card-sub">${e.clicks} clicks</div></div>
    </div>

    <div class="grid2">
      <div>
        <div class="panel">
          <div class="panel-h">Live activity <span class="live-tag"><span class="live-dot"></span>auto-refresh</span></div>
          <div class="activity">${activity.length?activity.map(act=>`<div class="act-row"><div class="act-ic">💻</div><div class="act-tx"><h4>Ad impression</h4><p>${new Date(act.ts).toLocaleTimeString('en-IN')}</p></div><div class="act-amt">+₹${(act.earnedPaise/100).toFixed(2)}</div></div>`).join(''):'<div class="act-empty">No activity yet.<br>Install the extension &amp; start coding.</div>'}</div>
        </div>
        <div class="panel" style="background:#EBF5EE;border-color:#A7F3C8">
          <div class="panel-h">🔌 Connect VS Code extension</div>
          <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Run <b>"WaitJI AI: Connect Your Account"</b> in VS Code → paste this User ID:</p>
          <div class="upi-box"><div class="upi-label">Your User ID</div><div class="ref-link"><input value="${me.id}" readonly id="userIdInput"><button class="btn-solid" onclick="copyUserId()">Copy</button></div></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-h">Your profile</div>
          <div class="upi-box">
            <div class="upi-label">Full name <span style="color:var(--red);font-size:10px">*required</span></div>
            <div class="upi-input"><input id="nameInput" placeholder="Enter your full name" value="${me.name?esc(me.name):''}"><button class="btn-solid" onclick="saveName()">Save</button></div>
            <div style="font-size:11px;margin-top:4px;color:${ps.checks?.name?.done?'#047857':'#B91C1C'}">${ps.checks?.name?.done?'✓ Saved':'Required for withdrawal'}</div>
          </div>
          <div class="upi-box" style="margin-top:14px">
            <div class="upi-label">Phone number <span style="color:var(--red);font-size:10px">*required</span></div>
            <div class="upi-input"><input id="phoneInput" placeholder="10-digit mobile" value="${me.phone?esc(me.phone):''}" maxlength="10" type="tel"><button class="btn-solid" onclick="savePhone()">Save</button></div>
            <div style="font-size:11px;margin-top:4px;color:${ps.checks?.phone?.done?'#047857':'#B91C1C'}">${ps.checks?.phone?.done?'✓ Saved':'Required for withdrawal'}</div>
          </div>
          <div class="upi-box" style="margin-top:14px">
            <div class="upi-label">Email</div>
            <div style="font-size:13px;color:${me.emailVerified?'#047857':'#B91C1C'};font-weight:600">${me.emailVerified?'✓ '+esc(me.email)+' — verified':'✗ Not verified — check your inbox'}</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-h">Payout method <span style="color:var(--red);font-size:10px">*one required</span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
            <button class="role-tab ${me.payoutMode!=='bank'?'active':''}" id="tabUpi" onclick="switchPayoutTab('upi')"><div style="font-size:13px;font-weight:700">💳 UPI ID</div><div style="font-size:11px;opacity:.7">Instant</div></button>
            <button class="role-tab ${me.payoutMode==='bank'?'active':''}" id="tabBank" onclick="switchPayoutTab('bank')"><div style="font-size:13px;font-weight:700">🏦 Bank Account</div><div style="font-size:11px;opacity:.7">NEFT/IMPS</div></button>
          </div>
          <div id="upiTab" style="display:${me.payoutMode==='bank'?'none':'block'}">
            ${me.upiId && me.payoutVerified
              ?`<div style="background:#EBF5EE;border:1.5px solid #A7F3C8;border-radius:9px;padding:12px;margin-bottom:10px">
                  <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Verified UPI</div>
                  <div style="font-weight:700;font-family:var(--mono)">${esc(me.upiId)}</div>
                  ${me.upiNameAtBank?`<div style="font-size:11px;color:#047857;margin-top:3px">✓ ${esc(me.upiNameAtBank)}</div>`:''}
                </div>
                <button class="mini-btn" onclick="showChangeUpi()">Change UPI</button>
                <div id="changeUpiBox" style="display:none;margin-top:10px">
                  <div class="upi-input"><input id="upiChangeInput" placeholder="new@upihandle"><button class="btn-solid" onclick="verifyAndSaveUpi()">Verify &amp; Save</button></div>
                  <div id="upiVerifyResult" style="font-size:12px;margin-top:6px"></div>
                </div>`
              :`<div class="upi-input"><input id="upiInput" placeholder="yourname@upi or 9876543210@okaxis"><button class="btn-solid" onclick="verifyAndSaveUpi()">Verify &amp; Save</button></div>
                <div id="upiVerifyResult" style="font-size:12px;margin-top:6px"></div>
                <p style="font-size:11px;color:var(--muted2);margin-top:4px">Enter UPI ID and click Verify &amp; Save</p>`
            }
          </div>
          <div id="bankTab" style="display:${me.payoutMode==='bank'?'block':'none'}">
            ${me.bankVerified && me.bankAccount
              ?`<div style="background:#EBF5EE;border:1.5px solid #A7F3C8;border-radius:9px;padding:12px;margin-bottom:10px">
                  <div style="font-size:11px;color:var(--muted)">Verified bank account</div>
                  <div style="font-weight:700;font-family:var(--mono)">•••• ${me.bankAccount?.slice(-4)||me.bankAccount}</div>
                  <div style="font-size:12px;color:var(--muted);margin-top:3px">${esc(me.bankIfsc||'')} · ${esc(me.bankName||'')}</div>
                </div>
                <button class="mini-btn" onclick="showBankForm()">Change account</button>
                <div id="bankFormBox" style="display:none;margin-top:10px">${bankFormHtml()}</div>`
              :bankFormHtml()
            }
          </div>
        </div>

        <div class="panel">
          <div class="panel-h">Withdrawal</div>
          ${withdrawals.length?`<div style="margin-bottom:14px">${withdrawals.slice(0,5).map(w=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><div><div style="font-weight:600">₹${(w.amountPaise/100).toFixed(2)}</div><div style="font-size:11px;color:var(--muted2)">${new Date(w.requestedAt).toLocaleDateString('en-IN')}</div>${w.autoPaid?'<div style="font-size:11px;color:#047857">⚡ Auto-transferred via Cashfree</div>':''}</div><span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;background:${w.status==='approved'||w.status==='paid'?'#DCFCE7':w.status==='rejected'?'#FEE2E2':'#FEF3C7'};color:${w.status==='approved'||w.status==='paid'?'#047857':w.status==='rejected'?'#B91C1C':'#92400E'}">${w.status}</span></div>`).join('')}</div>`:''}
          ${!ps.complete
            ?'<div style="background:#FEF9EC;border:1px solid #FDE68A;border-radius:10px;padding:12px 14px;font-size:13px;color:#92400E">🔒 Complete your profile to unlock withdrawal</div>'
            :hasPendingWithdrawal
            ?'<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:12px 14px;font-size:13px;color:#92400E">⏳ Withdrawal pending — will be auto-processed via Cashfree once reviewed</div>'
            :parseFloat(e.pendingRupees)<100
            ?`<div style="text-align:center;padding:16px;font-size:13.5px;color:var(--muted)">Earn <b>₹${(100-parseFloat(e.pendingRupees)).toFixed(2)}</b> more to unlock (min ₹100)</div>`
            :`<button class="btn-solid btn-payout" onclick="requestWithdrawal()">⚡ Auto-withdraw ₹${e.pendingRupees} via Cashfree</button><p style="font-size:11px;color:var(--muted2);text-align:center;margin-top:8px">Automatically transferred to your verified payout method</p>`
          }
        </div>

        <div class="ref-box">
          <h4>🤝 Your referral link</h4>
          <p>Share and earn 10% of referrals' earnings.</p>
          <div class="ref-link"><input value="${refLink}" readonly id="refInput"><button class="btn-solid" onclick="copyRef()">Copy</button></div>
        </div>
      </div>
    </div>`;
}

function bankFormHtml(){
  return `<div>
    <div style="margin-bottom:8px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">Account Holder Name</div>
      <input id="bankHolderInput" placeholder="Full name as per bank account" style="width:100%;background:var(--cream,#F8F5EE);border:1.5px solid var(--border,#D4D9CF);border-radius:9px;padding:10px 13px;font-family:var(--body);font-size:14px;outline:none;">
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">Account Number</div>
      <input id="bankAccInput" placeholder="Enter account number" type="text" inputmode="numeric" style="width:100%;background:var(--cream,#F8F5EE);border:1.5px solid var(--border,#D4D9CF);border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:14px;outline:none;letter-spacing:1px;">
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">Re-enter Account Number</div>
      <input id="bankAccConfirm" placeholder="Confirm account number" type="text" inputmode="numeric" style="width:100%;background:var(--cream,#F8F5EE);border:1.5px solid var(--border,#D4D9CF);border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:14px;outline:none;letter-spacing:1px;">
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">IFSC Code</div>
      <input id="bankIfscInput" placeholder="e.g. HDFC0001234" maxlength="11" oninput="this.value=this.value.toUpperCase()" style="width:100%;background:var(--cream,#F8F5EE);border:1.5px solid var(--border,#D4D9CF);border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:14px;outline:none;letter-spacing:1px;">
    </div>
    <button class="btn-solid" onclick="saveBank()" style="width:100%">Save bank account</button>

function switchPayoutTab(tab){
  document.getElementById('upiTab').style.display=tab==='upi'?'block':'none';
  document.getElementById('bankTab').style.display=tab==='bank'?'block':'none';
  document.getElementById('tabUpi').classList.toggle('active',tab==='upi');
  document.getElementById('tabBank').classList.toggle('active',tab==='bank');
  // Keep local state so tab stays selected after any minor re-render
  if(me) me._activePayoutTab = tab;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function saveName(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){ toast('⚠️ Enter your name'); return; }
  await fetch(API+'/v1/customer/profile',{method:'PATCH',headers:H,body:JSON.stringify({name})});
  toast('✓ Name saved'); load();
}

async function savePhone(){
  const phone=document.getElementById('phoneInput').value.trim().replace(/\D/g,'');
  if(!phone||phone.length!==10||!/^[6-9]/.test(phone)){ toast('⚠️ Enter a valid 10-digit Indian mobile number'); return; }
  const r=await fetch(API+'/v1/customer/profile',{method:'PATCH',headers:H,body:JSON.stringify({phone})});
  if((await r.json()).user){ toast('✓ Phone number saved'); load(); }
  else toast('⚠️ Could not save phone');
}

async function saveBank(){
  const ifsc=(document.getElementById('bankIfscInput')?.value||'').trim().toUpperCase();
  const acc=(document.getElementById('bankAccInput')?.value||'').trim();
  const accC=(document.getElementById('bankAccConfirm')?.value||'').trim();
  const holder=(document.getElementById('bankHolderInput')?.value||'').trim();
  const saveRes=document.getElementById('bankSaveResult');
  if(!ifsc||ifsc.length!==11){ toast('⚠️ Enter a valid 11-character IFSC code'); return; }
  if(!holder){ saveRes.innerHTML='<span style="color:#B91C1C">✗ Enter account holder name</span>'; return; }
  if(!acc||acc.length<9){ toast('⚠️ Enter a valid account number (min 9 digits)'); return; }
  if(acc!==accC){ saveRes.innerHTML='<span style="color:#B91C1C">✗ Account numbers do not match — please re-enter</span>'; return; }
  saveRes.textContent='Verifying…'; saveRes.style.color='var(--muted)';
  const r=await fetch(API+'/v1/customer/verify-bank',{method:'POST',headers:H,body:JSON.stringify({accountNumber:acc, ifsc, accountHolder:holder})});
  const d=await r.json();
  if(r.ok&&(d.success||d.valid)){
    saveRes.innerHTML=`<span style="color:#047857">✓ ${d.message||'Bank account saved'}</span>`;
    toast('✓ Bank account saved'); setTimeout(load,800);
  } else {
    saveRes.innerHTML=`<span style="color:#B91C1C">✗ ${d.error||'Could not save — check your details and try again'}</span>`;
  }
}

function showBankForm(){
  const box=document.getElementById('bankFormBox');
  if(box) box.style.display=box.style.display==='none'?'block':'none';
}
function showChangeBank(){
  const box=document.getElementById('changeBankBox');
  if(box) box.style.display=box.style.display==='none'?'block':'none';
}

function showChangeUpi(){
  const box=document.getElementById('changeUpiBox');
  box.style.display=box.style.display==='none'?'block':'none';
}

async function verifyAndSaveUpi(){
  const inputEl=document.getElementById('upiChangeInput')||document.getElementById('upiInput');
  const upi=(inputEl?.value||'').trim();
  const resultEl=document.getElementById('upiVerifyResult');
  if(!upi){ toast('⚠️ Enter a UPI ID'); return; }
  if(!upi.includes('@')){ resultEl.textContent='✗ UPI ID must contain @ (e.g. name@upi)'; resultEl.style.color='#B91C1C'; return; }
  resultEl.textContent='Verifying…'; resultEl.style.color='var(--muted)';
  try{
    const r=await fetch(API+'/v1/customer/verify-upi',{method:'POST',headers:H,body:JSON.stringify({upiId:upi})});
    const d=await r.json();
    if(!r.ok||!d.valid){
      resultEl.textContent='✗ '+(d.error||'UPI verification failed');
      resultEl.style.color='#B91C1C';
      return;
    }
    // Backend now saves UPI directly in verify-upi — just reload
    resultEl.textContent=d.message||'✓ Verified and saved';
    resultEl.style.color='#047857';
    toast('✓ UPI ID verified and saved!');
    setTimeout(()=>load(), 500);
  }catch(e){
    resultEl.textContent='✗ Network error — try again';
    resultEl.style.color='#B91C1C';
  }
}

async function requestWithdrawal(){
  if(!confirm('Request withdrawal of your full available balance? Admin will review and credit to your UPI ID.')) return;
  const r=await fetch(API+'/v1/customer/request-withdrawal',{method:'POST',headers:H});
  const d=await r.json();
  if(r.ok){ toast('✅ Withdrawal requested!','Admin will review in 1–2 business days'); load(); }
  else toast('⚠️ '+(d.error||'Could not process'));
}
function copyRef(){ const i=document.getElementById('refInput'); i.select(); navigator.clipboard.writeText(i.value); toast('✓ Referral link copied'); }
function copyUserId(){ const i=document.getElementById('userIdInput'); i.select(); navigator.clipboard.writeText(i.value); toast('✓ User ID copied — paste it in VS Code'); }

load();
setInterval(load,15000); // real-time refresh every 15s
</script>

</html>
